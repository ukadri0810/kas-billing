    function render() {
      const app = $('app');
      let appHtml = '';
      if (state.view === 'pos') appHtml = renderPOS();
      if (state.view === 'history') appHtml = renderHistory();
      if (state.view === 'expenses') appHtml = renderExpenses();
      if (state.view === 'dashboard') appHtml = renderDashboard();
      if (state.view === 'settings') appHtml = renderSettings();
      app.innerHTML = appHtml;
      $('checkout-dock').innerHTML = renderCheckoutDock();
      $('modals').innerHTML = renderModalState();
      updateFooterHeight();
    }



    /* =========================
       V4 — REUSABLE TOKEN OPEN BILLS
       ========================= */
    const OPEN_BILL_TOKEN_COUNT = 20;
    state.openBills = [];
    state.activeOpenBillId = null;
    state.activeOpenBillToken = null;
    state.openBillsModalOpen = false;
    state.saveOpenBillModalOpen = false;
    state.pendingOpenBillToken = null;
    state.openBillSearch = '';
    state.machineTransfer = null;

    let openBillAutosaveTimer = null;

    function formatToken(tokenNumber) {
      return String(Number(tokenNumber || 0)).padStart(2, '0');
    }

    async function loadOpenBills() {
      state.openBills = (await db.openBills.toArray()).sort((a, b) => Number(a.tokenNumber) - Number(b.tokenNumber));
    }

    function openBillById(id) {
      return state.openBills.find(b => Number(b.id) === Number(id)) || null;
    }

    function usedTokenSet() {
      return new Set(state.openBills.map(b => Number(b.tokenNumber)));
    }

    function availableTokenNumbers() {
      const used = usedTokenSet();
      return Array.from({ length: OPEN_BILL_TOKEN_COUNT }, (_, i) => i + 1).filter(n => !used.has(n));
    }

    function snapshotOpenBill() {
      return {
        items: JSON.stringify(state.cart),
        customerName: state.customer.name || '',
        customerPhone: state.customer.phone || '',
        discount: { ...state.discount },
        regularSubtotal: getCartRegularSubtotal(),
        groupRateSavings: getGroupRateSavings(),
        subtotal: getCartSubtotal(),
        totalAmount: getCartTotal(),
        rideCount: getCartQty(),
        updatedAt: new Date().toISOString()
      };
    }

    async function persistActiveOpenBill() {
      if (!state.activeOpenBillId) return;
      const exists = await db.openBills.get(state.activeOpenBillId);
      if (!exists) {
        state.activeOpenBillId = null;
        state.activeOpenBillToken = null;
        return;
      }
      await db.openBills.update(state.activeOpenBillId, snapshotOpenBill());
      await loadOpenBills();
    }

    function scheduleOpenBillAutosave() {
      if (!state.activeOpenBillId) return;
      clearTimeout(openBillAutosaveTimer);
      openBillAutosaveTimer = setTimeout(() => {
        persistActiveOpenBill().catch(error => console.warn('Open bill autosave failed', error));
      }, 250);
    }

    function resetSaleState() {
      clearTimeout(openBillAutosaveTimer);
      state.cart = {};
      state.customer = { name: '', phone: '' };
      state.discount = { type: 'none', value: 0 };
      state.machinePickerItemId = null;
      state.creditModalOpen = false;
      state.discountModalOpen = false;
      state.groupRateModalOpen = false;
      state.customerModalOpen = false;
      state.moreOpen = false;
      state.activeOpenBillId = null;
      state.activeOpenBillToken = null;
    }

    window.openOpenBills = async () => {
      await loadOpenBills();
      state.openBillSearch = '';
      state.openBillsModalOpen = true;
      render();
    };

    window.closeOpenBills = () => {
      state.openBillsModalOpen = false;
      state.openBillSearch = '';
      render();
    };

    window.filterOpenBills = value => {
      state.openBillSearch = String(value || '');
      render();
      requestAnimationFrame(() => {
        const input = $('openBillSearch');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      });
    };

    window.loadOpenBill = async id => {
      id = Number(id);
      if (state.activeOpenBillId === id) {
        state.openBillsModalOpen = false;
        render();
        return;
      }

      // Never throw away edits from another open token. Save them silently first.
      if (state.activeOpenBillId) await persistActiveOpenBill();
      else if (Object.keys(state.cart).length) {
        const ok = confirm('The current new sale has unsaved rides. Clear it and open this token?');
        if (!ok) return;
      }

      const bill = await db.openBills.get(id);
      if (!bill) {
        await loadOpenBills();
        showInlineError('That open bill is no longer available.');
        render();
        return;
      }

      try { state.cart = JSON.parse(bill.items || '{}'); }
      catch { state.cart = {}; }
      state.customer = { name: bill.customerName || '', phone: bill.customerPhone || '' };
      state.discount = bill.discount && typeof bill.discount === 'object' ? { ...bill.discount } : { type: 'none', value: 0 };
      state.activeOpenBillId = bill.id;
      state.activeOpenBillToken = Number(bill.tokenNumber);
      state.openBillsModalOpen = false;
      state.saveOpenBillModalOpen = false;
      state.groupRateModalOpen = false;
      state.pendingOpenBillToken = null;
      state.view = 'pos';
      ['pos', 'history', 'expenses', 'dashboard', 'settings'].forEach(v => $('nav-' + v)?.classList.toggle('active', v === 'pos'));
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    };

    window.openSaveOpenBill = async () => {
      if (!Object.keys(state.cart).length) return showInlineError('Add at least one ride first.');

      // Existing token: one tap saves and frees the POS for the next customer.
      if (state.activeOpenBillId) {
        await persistActiveOpenBill();
        const token = state.activeOpenBillToken;
        resetSaleState();
        await loadOpenBills();
        render();
        showInlineError(`Token ${formatToken(token)} saved. Ready for next customer.`);
        return;
      }

      await loadOpenBills();
      const available = availableTokenNumbers();
      if (!available.length) return showInlineError('All reusable tokens are currently in use.');
      state.pendingOpenBillToken = available[0];
      state.saveOpenBillModalOpen = true;
      render();
    };

    window.closeSaveOpenBill = () => {
      state.saveOpenBillModalOpen = false;
      state.pendingOpenBillToken = null;
      render();
    };

    window.selectOpenBillToken = token => {
      token = Number(token);
      if (!availableTokenNumbers().includes(token)) return;
      state.pendingOpenBillToken = token;
      render();
    };

    window.saveNewOpenBill = async () => {
      const token = Number(state.pendingOpenBillToken);
      if (!token || !availableTokenNumbers().includes(token)) return showInlineError('Choose an available token.');
      if (!Object.keys(state.cart).length) return showInlineError('This bill has no rides.');

      const customerName = $('openBillName')?.value.trim() || state.customer.name || '';
      const customerPhone = $('openBillPhone')?.value.trim() || state.customer.phone || '';
      state.customer = { name: customerName, phone: customerPhone };
      const now = new Date().toISOString();

      try {
        await db.openBills.add({
          tokenNumber: token,
          createdAt: now,
          ...snapshotOpenBill()
        });
        state.saveOpenBillModalOpen = false;
        state.pendingOpenBillToken = null;
        resetSaleState();
        await loadOpenBills();
        render();
        showInlineError(`Open bill saved as Token ${formatToken(token)}.`);
      } catch (error) {
        console.error(error);
        await loadOpenBills();
        showInlineError('That token is already in use. Choose another token.');
        render();
      }
    };

    window.startNewSale = async () => {
      if (state.activeOpenBillId) await persistActiveOpenBill();
      else if (Object.keys(state.cart).length && !confirm('Clear the current new sale and start again?')) return;
      resetSaleState();
      await loadOpenBills();
      render();
    };

    // For machine reassignment, quantities can be split without creating an
    // operations dashboard. Example: 3 Sleeper on Jetski 1 -> move only 2 to Boat.
    function applyMachineTransfer(cartKey, targetMachine, qty) {
      const line = state.cart[cartKey];
      if (!line) return;
      const currentMachine = lineMachine(line);
      const allowed = line.item.isTowable ? ['JETSKI1', 'JETSKI2', 'SPEEDBOAT'] : (isJetskiRide(line.item) ? ['JETSKI1', 'JETSKI2'] : []);
      if (!allowed.includes(targetMachine) || currentMachine === targetMachine) return;

      const moveQty = Math.min(Number(line.qty || 0), Math.max(1, Number(qty || 1)));
      const newKey = `${line.item.id}_${targetMachine}_${line.item.isTowable ? 'TOW' : 'DIRECT'}`;
      const moved = { ...line, qty: moveQty, machineId: targetMachine, towedBy: line.item.isTowable ? targetMachine : null };
      line.qty -= moveQty;
      if (line.qty <= 0) delete state.cart[cartKey];
      if (state.cart[newKey]) state.cart[newKey].qty += moveQty;
      else state.cart[newKey] = moved;
      scheduleOpenBillAutosave();
      state.machineTransfer = null;
      renderCartEditor();
    }

    window.transferMachine = (cartKey, targetMachine) => {
      if (state.checkoutLocked || !state.cart[cartKey]) return;
      const line = state.cart[cartKey];
      if (Number(line.qty || 0) <= 1) {
        applyMachineTransfer(cartKey, targetMachine, 1);
        return;
      }
      state.machineTransfer = { cartKey, targetMachine };
      render();
    };

    window.closeMachineTransfer = () => {
      state.machineTransfer = null;
      renderCartEditor();
    };

    window.confirmMachineTransfer = qty => {
      const move = state.machineTransfer;
      if (!move) return;
      applyMachineTransfer(move.cartKey, move.targetMachine, Number(qty));
    };

    // Auto-save edits when an open token is actively being worked on.
    const v3AddCartLine = addCartLine;
    addCartLine = function(item, machineId = null) {
      v3AddCartLine(item, machineId);
      scheduleOpenBillAutosave();
    };

    const v3UpdateQty = window.updateQty;
    window.updateQty = (cartKey, delta) => {
      v3UpdateQty(cartKey, delta);
      scheduleOpenBillAutosave();
    };

    const v3SaveCustomerInfo = window.saveCustomerInfo;
    window.saveCustomerInfo = () => {
      v3SaveCustomerInfo();
      scheduleOpenBillAutosave();
    };

    const v3ApplyDiscount = window.applyDiscount;
    window.applyDiscount = type => {
      v3ApplyDiscount(type);
      scheduleOpenBillAutosave();
    };

    const v3ClearDiscount = window.clearDiscount;
    window.clearDiscount = () => {
      v3ClearDiscount();
      scheduleOpenBillAutosave();
    };

    // Checkout closes a reusable token atomically only after the invoice saves.
    window.processCheckout = async method => {
      if (state.checkoutLocked) return;
      const total = getCartTotal();
      const subtotal = getCartSubtotal();
      if (subtotal <= 0) return;

      let refText = '';
      if (method === 'CREDIT') {
        refText = $('creditInput')?.value.trim() || '';
        if (!refText) {
          showInlineError('Enter hotel, room or customer reference.');
          return;
        }
      }

      state.checkoutLocked = true;
      render();
      const discountAmount = getDiscountAmount();
      const cartSnapshot = JSON.stringify(state.cart);
      const machineUsage = [...new Set(Object.values(state.cart).map(lineMachine).filter(Boolean))];
      const timestamp = new Date().toISOString();
      const fy = getFinancialYear(new Date(timestamp));
      const openBillId = state.activeOpenBillId;
      const openBillToken = state.activeOpenBillToken;

      try {
        let invoiceNumber = 0;
        let receiptId = '';
        let txId = null;

        await db.transaction('rw', db.transactions, db.settings, db.openBills, async () => {
          const allTransactions = await db.transactions.toArray();
          const highestStored = allTransactions.reduce((highest, tx) => Math.max(highest, receiptSequence(tx.receiptId, fy)), 0);
          const savedSettings = await db.settings.get('pos');
          const sameFY = Number(savedSettings?.invoiceFormatVersion || 0) >= 3 && savedSettings?.invoiceFY === fy;
          const configuredNext = sameFY ? Number(savedSettings?.nextInvoiceNumber || 1) : 1;
          invoiceNumber = Math.max(1, configuredNext, highestStored + 1);
          receiptId = formatInvoiceId(fy, invoiceNumber);

          txId = await db.transactions.add({
            receiptId,
            financialYear: fy,
            invoiceSequence: invoiceNumber,
            timestamp,
            totalAmount: total,
            discountAmount,
            groupRateSavings: getGroupRateSavings(),
            regularSubtotal: getCartRegularSubtotal(),
            groupSubtotal: getCartSubtotal(),
            paymentMethod: method,
            reference: refText,
            customerName: state.customer.name,
            customerPhone: state.customer.phone,
            items: cartSnapshot,
            machineUsage,
            openBillToken: openBillToken || null,
            status: 'COMPLETED'
          });

          await db.settings.put({
            key: 'pos',
            ...state.settings,
            invoiceFormatVersion: 3,
            invoiceFY: fy,
            nextInvoiceNumber: invoiceNumber + 1
          });

          if (openBillId) await db.openBills.delete(openBillId);
        });

        state.highestInvoiceNumber = Math.max(state.highestInvoiceNumber, invoiceNumber);
        state.settings.invoiceFY = fy;
        state.settings.nextInvoiceNumber = invoiceNumber + 1;
        resetSaleState();
        state.checkoutLocked = false;
        state.successTxId = txId;
        await loadOpenBills();
        await refreshDailyData();
        render();
        showPaymentSuccess(total, receiptId, method);

        if (state.settings.autoPrint === 'auto') setTimeout(() => printReceiptById(txId, false), 200);
      } catch (error) {
        console.error(error);
        state.checkoutLocked = false;
        render();
        showInlineError('Payment could not be saved. Please try again.');
      }
    };

    window.importBackup = async input => {
      const file = input?.files?.[0];
      if (!file) return;
      if (!confirm('Restore this backup? Current local POS data will be replaced.')) { input.value = ''; return; }
      try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data.transactions) || !Array.isArray(data.expenses) || !Array.isArray(data.menu)) throw new Error('Invalid backup');
        await db.transaction('rw', db.transactions, db.expenses, db.menu, db.settings, db.openBills, async () => {
          await Promise.all([db.transactions.clear(), db.expenses.clear(), db.menu.clear(), db.settings.clear(), db.openBills.clear()]);
          if (data.transactions.length) await db.transactions.bulkAdd(data.transactions);
          if (data.expenses.length) await db.expenses.bulkAdd(data.expenses);
          if (data.menu.length) await db.menu.bulkAdd(data.menu);
          if (Array.isArray(data.settings) && data.settings.length) await db.settings.bulkPut(data.settings);
          if (Array.isArray(data.openBills) && data.openBills.length) await db.openBills.bulkAdd(data.openBills);
        });
        await loadAppSettings();
        await loadInvoiceSequence();
        await loadMenuData();
        await loadHistoryData();
        await loadExpenseData();
        await loadOpenBills();
        resetSaleState();
        render();
        showInlineError('Backup restored successfully.');
      } catch (error) {
        console.error(error);
        showInlineError('Invalid or unreadable backup file.');
      } finally {
        input.value = '';
      }
    };

    // Extend the original boot sequence with reusable open bills.
    const v3Boot = boot;
    boot = async function() {
      await v3Boot();
      await loadOpenBills();
      render();
    };

    window.addEventListener('resize', updateFooterHeight);
    window.addEventListener('orientationchange', () => setTimeout(updateFooterHeight, 100));
    boot();
  </script>

</body>
</html>
