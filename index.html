<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WaterSports POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PDF Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    body { user-select: none; touch-action: manipulation; }
    .nav-active { color: #2563eb; }
    .nav-inactive { color: #6b7280; }
    /* Hides the scrollbar for the cart area but keeps it scrollable */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans pb-24 h-screen flex flex-col overflow-hidden">

  <!-- Main Content Area -->
  <div id="app" class="p-4 flex-1 overflow-y-auto"></div>

  <!-- Bottom Navigation Bar -->
  <div class="fixed bottom-0 left-0 w-full bg-white border-t shadow-[0_-5px_10px_rgba(0,0,0,0.05)] z-50 flex justify-between px-4 py-2 pb-safe">
    <button onclick="setView('pos')" id="nav-pos" class="flex flex-col items-center p-2 nav-active w-16">
      <i class="fa-solid fa-cash-register text-xl"></i>
      <span class="text-[10px] mt-1 font-bold">POS</span>
    </button>
    <button onclick="setView('history')" id="nav-history" class="flex flex-col items-center p-2 nav-inactive w-16">
      <i class="fa-solid fa-clock-rotate-left text-xl"></i>
      <span class="text-[10px] mt-1 font-bold">History</span>
    </button>
    <button onclick="setView('expenses')" id="nav-expenses" class="flex flex-col items-center p-2 nav-inactive w-16">
      <i class="fa-solid fa-receipt text-xl"></i>
      <span class="text-[10px] mt-1 font-bold">Expense</span>
    </button>
    <button onclick="setView('dashboard')" id="nav-dashboard" class="flex flex-col items-center p-2 nav-inactive w-16">
      <i class="fa-solid fa-chart-pie text-xl"></i>
      <span class="text-[10px] mt-1 font-bold">EOD</span>
    </button>
    <button onclick="setView('settings')" id="nav-settings" class="flex flex-col items-center p-2 nav-inactive w-16">
      <i class="fa-solid fa-gear text-xl"></i>
      <span class="text-[10px] mt-1 font-bold">Setup</span>
    </button>
  </div>

  <script>
    // 1. Initialize Offline Database (v3)
    const db = new Dexie('WaterSportsV3');
    db.version(1).stores({
      transactions: '++id, timestamp, totalAmount, paymentMethod, status',
      expenses: '++id, timestamp, description, amount',
      menu: '++id, name, price, isTowable'
    });

    // 2. Application State
    let state = {
      view: 'pos',
      cart: {}, // Format: { "id_towingMachine": { item, qty, towedBy } }
      menu: [],
      history: [],
      expenses: [],
      activeJetski: 1,
      towingMachine: 'JETSKI', // 'JETSKI' or 'SPEEDBOAT'
      creditModalOpen: false,
      stats: { cash: 0, online: 0, credit: 0, expenseTotal: 0, netCash: 0, list: [] }
    };

    // 3. Boot Sequence
    async function boot() {
      const count = await db.menu.count();
      if (count === 0) {
        await db.menu.bulkAdd([
          { name: 'Jetski (Single)', price: 400, isTowable: false },
          { name: 'Banana Ride', price: 300, isTowable: true },
          { name: 'Bandwagon', price: 400, isTowable: true },
          { name: 'Speed Boat Ride', price: 1500, isTowable: false } // Standalone ride
        ]);
      }
      await loadMenuData();
      render();
    }

    async function loadMenuData() { state.menu = await db.menu.toArray(); }
    
    async function loadHistoryData() {
      const today = new Date().toISOString().split('T')[0];
      const all = await db.transactions.toArray();
      state.history = all.filter(tx => tx.timestamp.startsWith(today)).reverse();
    }

    async function loadExpenseData() {
      const today = new Date().toISOString().split('T')[0];
      const all = await db.expenses.toArray();
      state.expenses = all.filter(ex => ex.timestamp.startsWith(today)).reverse();
    }

    async function loadDashboardData() {
      await loadHistoryData();
      await loadExpenseData();
      let s = { cash: 0, online: 0, credit: 0, expenseTotal: 0, netCash: 0, list: [] };
      
      state.history.filter(tx => tx.status !== 'VOID').forEach(tx => {
        if (tx.paymentMethod === 'CASH') s.cash += tx.totalAmount;
        if (tx.paymentMethod === 'ONLINE') s.online += tx.totalAmount;
        if (tx.paymentMethod === 'CREDIT') { s.credit += tx.totalAmount; s.list.push(tx); }
      });

      state.expenses.forEach(ex => s.expenseTotal += ex.amount);
      s.netCash = s.cash - s.expenseTotal;
      state.stats = s;
    }

    // 4. Cart Logic
    function getCartTotal() {
      return Object.values(state.cart).reduce((sum, cartItem) => sum + (cartItem.item.price * cartItem.qty), 0);
    }

    window.handleTap = (menuId) => { 
      const item = state.menu.find(m => m.id === menuId);
      const towedBy = item.isTowable ? state.towingMachine : null;
      const cartKey = towedBy ? `${menuId}_${towedBy}` : `${menuId}_none`;

      if (state.cart[cartKey]) {
        state.cart[cartKey].qty += 1;
      } else {
        state.cart[cartKey] = { item, qty: 1, towedBy };
      }
      render(); 
    };

    window.updateQty = (cartKey, delta) => {
      if (!state.cart[cartKey]) return;
      state.cart[cartKey].qty += delta;
      if (state.cart[cartKey].qty <= 0) delete state.cart[cartKey];
      render();
    };

    window.clearCart = () => { state.cart = {}; render(); };
    window.setJetski = (num) => { state.activeJetski = num; render(); };
    window.setTowingMachine = (machine) => { state.towingMachine = machine; render(); };
    window.toggleCreditModal = (isOpen) => { state.creditModalOpen = isOpen; render(); };

    // 5. Processing & Transactions
    window.processCheckout = async (method) => {
      const total = getCartTotal();
      if (total === 0) return;

      let refText = '';
      if (method === 'CREDIT') {
        refText = document.getElementById('creditInput').value;
        if (!refText) { alert("Please enter a location"); return; }
      }

      const receiptId = 'INV-' + Math.floor(10000 + Math.random() * 90000);

      await db.transactions.add({
        receiptId: receiptId,
        timestamp: new Date().toISOString(),
        totalAmount: total,
        paymentMethod: method,
        reference: refText,
        items: JSON.stringify(state.cart),
        activeJetskiId: state.activeJetski,
        status: 'COMPLETED'
      });

      state.cart = {};
      state.creditModalOpen = false;
      state.activeJetski = state.activeJetski === 1 ? 2 : 1; 
      render();
    };

    window.voidTransaction = async (id) => {
      if (confirm("Are you sure you want to void this transaction?")) {
        await db.transactions.update(id, { status: 'VOID' });
        await loadHistoryData();
        render();
      }
    };

    window.addExpense = async () => {
      const desc = document.getElementById('expDesc').value;
      const amt = parseFloat(document.getElementById('expAmt').value);
      if (!desc || !amt) return;

      await db.expenses.add({
        timestamp: new Date().toISOString(),
        description: desc,
        amount: amt
      });
      await loadExpenseData();
      render();
    };

    window.addMenuItem = async () => {
      const name = document.getElementById('menuName').value;
      const price = parseFloat(document.getElementById('menuPrice').value);
      const isTowable = document.getElementById('menuTowable').checked;
      if (!name || !price) return;

      await db.menu.add({ name, price, isTowable });
      await loadMenuData();
      render();
    };

    window.deleteMenuItem = async (id) => {
      if (confirm("Delete this ride?")) {
        await db.menu.delete(id);
        await loadMenuData();
        render();
      }
    };

    // 6. PDF Generation (Updated with your logo)
    window.downloadBill = (txId) => {
      const tx = state.history.find(t => t.id === txId);
      if (!tx) return;

      const items = JSON.parse(tx.items);
      let itemsHtml = Object.values(items).map(cartItem => `
        <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px;">
          <span>${cartItem.qty}x ${cartItem.item.name} ${cartItem.towedBy ? `<br><small style="color: #666;">(Towed by: ${cartItem.towedBy})</small>` : ''}</span>
          <span style="font-weight: bold;">₹${cartItem.item.price * cartItem.qty}</span>
        </div>
      `).join('');

      // Create a temporary container for the PDF layout
      const element = document.createElement('div');
      element.innerHTML = `
        <div style="padding: 20px; font-family: 'Helvetica', sans-serif; color: #000; width: 300px;">
          <div style="text-align: center; border-bottom: 2px dashed #000; padding-bottom: 10px; margin-bottom: 15px;">
            
            <!-- YOUR BRAND LOGO -->
            <img src="assets/kas.png" style="max-height: 60px; margin: 0 auto 10px; display: block;" />
            
            <h2 style="margin: 0; font-size: 22px; text-transform: uppercase;">WaterSports</h2>
            <p style="margin: 5px 0 0; font-size: 12px; color: #333;">Receipt: ${tx.receiptId || 'INV-000'}</p>
            <p style="margin: 2px 0 0; font-size: 12px; color: #333;">${new Date(tx.timestamp).toLocaleString()}</p>
          </div>
          <div style="margin-bottom: 15px;">
            ${itemsHtml}
          </div>
          <div style="border-top: 2px dashed #000; padding-top: 10px; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold;">
            <span>TOTAL (${tx.paymentMethod})</span>
            <span>₹${tx.totalAmount}</span>
          </div>
          ${tx.reference ? `<p style="text-align: center; font-size: 14px; margin-top: 15px;">Ref: ${tx.reference}</p>` : ''}
          <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #555;">
            Thank you for riding with us!
          </div>
        </div>
      `;

      html2pdf().set({
        margin: 5,
        filename: `Bill_${tx.receiptId || txId}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: [80, 150], orientation: 'portrait' } // Thermal printer size format
      }).from(element).save();
    };

    // 7. Navigation & Rendering
    window.setView = async (viewName) => {
      state.view = viewName;
      ['pos', 'history', 'expenses', 'dashboard', 'settings'].forEach(v => {
        const el = document.getElementById('nav-' + v);
        el.className = el.className.replace('nav-active', '').replace('nav-inactive', '');
        el.classList.add(state.view === v ? 'nav-active' : 'nav-inactive');
      });

      if (viewName === 'history') await loadHistoryData();
      if (viewName === 'expenses') await loadExpenseData();
      if (viewName === 'dashboard') await loadDashboardData();
      if (viewName === 'settings') await loadMenuData();
      
      render();
    };

    function render() {
      const app = document.getElementById('app');
      let html = '';

      // --- VIEW: POS ---
      if (state.view === 'pos') {
        const total = getCartTotal();
        const cartItems = Object.entries(state.cart);

        html += `
          <!-- Top Toggles -->
          <div class="grid grid-cols-2 gap-2 mb-4">
            <div class="bg-white p-3 rounded shadow">
              <div class="text-xs font-bold text-gray-500 mb-2 uppercase">Jetski Queue</div>
              <div class="flex gap-2">
                <button onclick="setJetski(1)" class="flex-1 py-1 text-lg font-bold rounded ${state.activeJetski === 1 ? 'bg-green-500 text-white' : 'bg-gray-200'}">1</button>
                <button onclick="setJetski(2)" class="flex-1 py-1 text-lg font-bold rounded ${state.activeJetski === 2 ? 'bg-green-500 text-white' : 'bg-gray-200'}">2</button>
              </div>
            </div>
            <div class="bg-white p-3 rounded shadow">
              <div class="text-xs font-bold text-gray-500 mb-2 uppercase">Towing Machine</div>
              <div class="flex gap-2">
                <button onclick="setTowingMachine('JETSKI')" class="flex-1 py-1 text-sm font-bold rounded ${state.towingMachine === 'JETSKI' ? 'bg-blue-500 text-white' : 'bg-gray-200'}">Jetski</button>
                <button onclick="setTowingMachine('SPEEDBOAT')" class="flex-1 py-1 text-sm font-bold rounded ${state.towingMachine === 'SPEEDBOAT' ? 'bg-blue-500 text-white' : 'bg-gray-200'}">Boat</button>
              </div>
            </div>
          </div>
          
          <!-- Menu Grid -->
          <div class="grid grid-cols-2 gap-3 mb-4">
            ${state.menu.map(item => `
              <button onclick="handleTap(${item.id})" class="bg-white p-4 rounded shadow active:bg-blue-100 flex flex-col items-center justify-center min-h-[90px]">
                <span class="text-base font-bold text-gray-800 text-center leading-tight">${item.name}</span>
                <span class="text-gray-500 text-sm mt-1">₹${item.price}</span>
              </button>
            `).join('')}
          </div>

          <!-- Live Cart Editor -->
          ${cartItems.length > 0 ? `
            <div class="bg-white rounded shadow p-3 mb-[180px] max-h-[200px] overflow-y-auto no-scrollbar border-2 border-blue-100">
              <h3 class="text-xs font-bold text-gray-400 uppercase mb-2 border-b pb-1">Current Order</h3>
              ${cartItems.map(([key, data]) => `
                <div class="flex justify-between items-center mb-2">
                  <div class="flex-1 leading-tight">
                    <div class="font-bold text-sm">${data.item.name}</div>
                    ${data.towedBy ? `<div class="text-[10px] text-gray-500">Towed: ${data.towedBy}</div>` : ''}
                  </div>
                  <div class="flex items-center gap-3">
                    <button onclick="updateQty('${key}', -1)" class="w-8 h-8 rounded-full bg-red-100 text-red-600 font-bold flex items-center justify-center text-xl active:bg-red-200">-</button>
                    <span class="font-bold text-lg w-4 text-center">${data.qty}</span>
                    <button onclick="updateQty('${key}', 1)" class="w-8 h-8 rounded-full bg-green-100 text-green-600 font-bold flex items-center justify-center text-xl active:bg-green-200">+</button>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : '<div class="mb-[180px]"></div>'}

          <!-- Checkout Bar -->
          <div class="fixed bottom-[65px] left-0 w-full bg-white p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] border-t z-40">
            <div class="flex justify-between items-center mb-3">
              <span class="text-xl font-bold">Total:</span>
              <span class="text-3xl font-bold text-green-600">₹${total}</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="processCheckout('CASH')" class="bg-green-500 text-white py-3 font-bold text-lg rounded active:bg-green-700">CASH</button>
              <button onclick="processCheckout('ONLINE')" class="bg-blue-500 text-white py-3 font-bold text-lg rounded active:bg-blue-700">ONLINE</button>
              <button onclick="toggleCreditModal(true)" class="bg-yellow-500 text-white py-3 font-bold text-lg rounded active:bg-yellow-700">CREDIT</button>
            </div>
          </div>
        `;

        if (state.creditModalOpen) {
          html += `
            <div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-[60]">
              <div class="bg-white rounded-lg p-6 w-full max-w-md">
                <h2 class="text-xl font-bold mb-4">Credit Location (Hotel/Room)</h2>
                <input id="creditInput" type="text" class="w-full border-2 border-gray-300 p-4 rounded text-xl mb-4" autofocus>
                <div class="flex gap-2">
                  <button onclick="toggleCreditModal(false)" class="flex-1 p-3 bg-gray-200 font-bold rounded">Cancel</button>
                  <button onclick="processCheckout('CREDIT')" class="flex-1 p-3 bg-yellow-500 text-white font-bold rounded">Save</button>
                </div>
              </div>
            </div>
          `;
        }
      } 
      
      // --- VIEW: HISTORY ---
      else if (state.view === 'history') {
        html += `
          <h2 class="text-2xl font-bold mb-4">Today's Tickets</h2>
          <div class="bg-white rounded shadow overflow-hidden">
            ${state.history.length === 0 ? '<p class="p-4 text-gray-500">No sales yet.</p>' : 
              state.history.map((tx, index) => {
                const itemsStr = Object.values(JSON.parse(tx.items)).map(c => `${c.qty}x ${c.item.name}`).join(', ');
                return `
                <div class="p-4 border-b ${tx.status === 'VOID' ? 'bg-red-50 opacity-50' : ''}">
                  <div class="flex justify-between items-start mb-2">
                    <div>
                      <div class="font-bold text-lg">₹${tx.totalAmount} <span class="text-sm font-normal text-gray-500">(${tx.paymentMethod})</span></div>
                      <div class="text-xs text-gray-400">${new Date(tx.timestamp).toLocaleTimeString()} ${tx.reference ? '- ' + tx.reference : ''}</div>
                    </div>
                    ${tx.status === 'COMPLETED' && index === 0 ? `<button onclick="voidTransaction(${tx.id})" class="bg-red-100 text-red-600 px-3 py-1 rounded text-sm font-bold border border-red-200">Void</button>` : 
                     tx.status === 'VOID' ? '<span class="text-red-500 font-bold text-sm">VOIDED</span>' : ''}
                  </div>
                  <div class="text-sm text-gray-600 mb-3">${itemsStr}</div>
                  ${tx.status === 'COMPLETED' ? `
                    <button onclick="downloadBill(${tx.id})" class="w-full py-2 bg-gray-100 text-gray-700 rounded text-sm font-bold flex items-center justify-center gap-2 border">
                      <i class="fa-solid fa-file-pdf"></i> Download Bill
                    </button>
                  ` : ''}
                </div>
              `}).join('')}
          </div>
        `;
      }

      // --- VIEW: SETTINGS ---
      else if (state.view === 'settings') {
        html += `
          <h2 class="text-2xl font-bold mb-4">Menu Setup</h2>
          <div class="bg-white p-4 rounded shadow mb-6">
            <input id="menuName" type="text" placeholder="Ride Name (e.g. Speed Boat Ride)" class="w-full border p-3 rounded mb-3">
            <input id="menuPrice" type="number" placeholder="Price (₹)" class="w-full border p-3 rounded mb-3">
            <label class="flex items-center gap-2 mb-4 p-2 bg-gray-50 border rounded">
              <input type="checkbox" id="menuTowable" class="w-5 h-5">
              <span class="text-sm font-bold text-gray-700">Is this a Towable item? (Requires boat/jetski)</span>
            </label>
            <button onclick="addMenuItem()" class="w-full bg-blue-600 text-white py-3 rounded font-bold">Add to Menu</button>
          </div>
          
          <h3 class="font-bold text-gray-600 mb-2">Current Active Menu</h3>
          <div class="bg-white rounded shadow">
            ${state.menu.map(item => `
              <div class="p-4 border-b flex justify-between items-center">
                <div>
                  <div class="font-bold">${item.name}</div>
                  <div class="text-sm text-gray-500">₹${item.price} ${item.isTowable ? '<span class="ml-2 text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">TOWABLE</span>' : ''}</div>
                </div>
                <button onclick="deleteMenuItem(${item.id})" class="text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
              </div>
            `).join('')}
          </div>
        `;
      }

      // --- VIEW: EXPENSES ---
      else if (state.view === 'expenses') {
        html += `
          <h2 class="text-2xl font-bold mb-4">Log Petty Cash</h2>
          <div class="bg-white p-4 rounded shadow mb-6">
            <input id="expDesc" type="text" placeholder="e.g. Boat Fuel, Ice" class="w-full border p-3 rounded mb-3">
            <input id="expAmt" type="number" placeholder="Amount (₹)" class="w-full border p-3 rounded mb-3">
            <button onclick="addExpense()" class="w-full bg-gray-800 text-white py-3 rounded font-bold">Add Expense</button>
          </div>
          <h3 class="font-bold text-gray-600 mb-2">Today's Expenses</h3>
          <div class="bg-white rounded shadow">
            ${state.expenses.length === 0 ? '<p class="p-4 text-gray-500">No expenses logged today.</p>' : 
              state.expenses.map(ex => `
                <div class="p-4 border-b flex justify-between">
                  <span>${ex.description}</span>
                  <span class="font-bold text-red-500">-₹${ex.amount}</span>
                </div>
              `).join('')}
          </div>
        `;
      }

      // --- VIEW: DASHBOARD (EOD) ---
      else if (state.view === 'dashboard') {
        html += `
          <h2 class="text-2xl font-bold mb-4">End of Day</h2>
          <div class="bg-white p-4 rounded shadow mb-4">
            <div class="flex justify-between items-center mb-2 pb-2 border-b">
              <span class="text-gray-600">Total Cash In:</span>
              <span class="font-bold">₹${state.stats.cash}</span>
            </div>
            <div class="flex justify-between items-center mb-2 pb-2 border-b">
              <span class="text-gray-600">Cash Expenses:</span>
              <span class="font-bold text-red-500">-₹${state.stats.expenseTotal}</span>
            </div>
            <div class="flex justify-between items-center text-xl mt-4 bg-green-50 p-3 rounded">
              <span class="font-bold text-green-800">Net Cash Drawer:</span>
              <span class="font-bold text-green-700">₹${state.stats.netCash}</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-blue-50 p-4 rounded text-center">
              <div class="text-sm text-blue-600 font-bold uppercase">Online (UPI)</div>
              <div class="text-2xl font-bold text-blue-700">₹${state.stats.online}</div>
            </div>
            <div class="bg-yellow-50 p-4 rounded text-center">
              <div class="text-sm text-yellow-600 font-bold uppercase">Credits</div>
              <div class="text-2xl font-bold text-yellow-700">₹${state.stats.credit}</div>
            </div>
          </div>
          
          <h3 class="font-bold text-gray-600 mb-2">Pending Collections</h3>
          <div class="bg-white rounded shadow">
            ${state.stats.list.length === 0 ? '<p class="p-4 text-gray-500">No pending credits.</p>' : 
              state.stats.list.map(tx => `
                <div class="p-3 border-b flex justify-between">
                  <span class="font-bold">${tx.reference}</span>
                  <span class="text-red-500 font-bold">₹${tx.totalAmount}</span>
                </div>
              `).join('')}
          </div>
        `;
      }

      app.innerHTML = html;
    }

    boot();
  </script>
</body>
</html>
