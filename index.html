<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WaterSports POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    body { user-select: none; touch-action: manipulation; }
    .nav-active { color: #2563EB; border-top: 3px solid #2563EB; background-color: #EFF6FF; }
    .nav-inactive { color: #6B7280; border-top: 3px solid transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
    
    /* Strict 80mm Thermal Printer Styling */
    .receipt-container {
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      background: #fff;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace; /* Monospace mimics thermal receipt output */
      color: #000;
      box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-[190px]">

  <!-- Main Content Area -->
  <main id="app" class="px-4 w-full max-w-2xl mx-auto"></main>

  <!-- STRICTLY FIXED Footer Container -->
  <footer class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-300 shadow-[0_-5px_15px_rgba(0,0,0,0.1)] z-40 flex flex-col items-center">
    
    <!-- Dynamic POS Checkout Bar injects here -->
    <div id="checkout-dock" class="w-full max-w-2xl"></div>

    <!-- Persistent Bottom Navigation -->
    <nav class="flex justify-between items-center bg-white w-full max-w-2xl">
      <button onclick="setView('pos')" id="nav-pos" class="flex flex-col items-center pt-2 pb-safe nav-active w-1/5 transition-colors">
        <i class="fa-solid fa-cash-register text-xl mb-1"></i>
        <span class="text-[11px] font-bold uppercase tracking-wide">POS</span>
      </button>
      <button onclick="setView('history')" id="nav-history" class="flex flex-col items-center pt-2 pb-safe nav-inactive w-1/5 transition-colors">
        <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
        <span class="text-[11px] font-bold uppercase tracking-wide">History</span>
      </button>
      <button onclick="setView('expenses')" id="nav-expenses" class="flex flex-col items-center pt-2 pb-safe nav-inactive w-1/5 transition-colors">
        <i class="fa-solid fa-receipt text-xl mb-1"></i>
        <span class="text-[11px] font-bold uppercase tracking-wide">Expense</span>
      </button>
      <button onclick="setView('dashboard')" id="nav-dashboard" class="flex flex-col items-center pt-2 pb-safe nav-inactive w-1/5 transition-colors">
        <i class="fa-solid fa-chart-pie text-xl mb-1"></i>
        <span class="text-[11px] font-bold uppercase tracking-wide">EOD</span>
      </button>
      <button onclick="setView('settings')" id="nav-settings" class="flex flex-col items-center pt-2 pb-safe nav-inactive w-1/5 transition-colors">
        <i class="fa-solid fa-gear text-xl mb-1"></i>
        <span class="text-[11px] font-bold uppercase tracking-wide">Setup</span>
      </button>
    </nav>
  </footer>

  <!-- Modal Container -->
  <div id="modals"></div>

  <script>
    const db = new Dexie('WaterSportsV6');
    db.version(1).stores({
      transactions: '++id, receiptId, timestamp, totalAmount, discountAmount, paymentMethod, reference, customerName, customerPhone, status',
      expenses: '++id, timestamp, description, amount',
      menu: '++id, name, price, isTowable'
    });

    let state = {
      view: 'pos',
      cart: {}, 
      menu: [],
      history: [],
      expenses: [],
      activeJetski: 1,
      towingMachine: 'JETSKI',
      customerModalOpen: false,
      creditModalOpen: false,
      discountModalOpen: false,
      previewTxId: null,
      isKOTPreview: false, // Tracks whether we are previewing KOT or Bill
      editingRideId: null,
      customer: { name: '', phone: '' },
      discount: { type: 'none', value: 0 }, 
      stats: { cash: 0, online: 0, credit: 0, expenseTotal: 0, netCash: 0, voidCount: 0, voidAmount: 0, list: [] }
    };

    async function boot() {
      const count = await db.menu.count();
      if (count === 0) {
        await db.menu.bulkAdd([
          { name: 'Jetski', price: 400, isTowable: false },
          { name: 'Speedboat', price: 250, isTowable: false },
          { name: 'Bandwagon', price: 200, isTowable: true },
          { name: 'Sleeper', price: 200, isTowable: true },
          { name: 'Ringo', price: 200, isTowable: true },
          { name: 'Banana', price: 200, isTowable: true },
          { name: 'Double banana', price: 200, isTowable: true }
        ]);
      }
      await loadMenuData();
      render();
    }

    async function loadMenuData() { state.menu = await db.menu.toArray(); }
    
    async function loadHistoryData() {
      const today = new Date().toISOString().split('T')[0];
      const all = await db.transactions.toArray();
      state.history = all.filter(tx => tx.timestamp.startsWith(today)).reverse();
    }

    async function loadExpenseData() {
      const today = new Date().toISOString().split('T')[0];
      const all = await db.expenses.toArray();
      state.expenses = all.filter(ex => ex.timestamp.startsWith(today)).reverse();
    }

    async function loadDashboardData() {
      await loadHistoryData();
      await loadExpenseData();
      let s = { cash: 0, online: 0, credit: 0, expenseTotal: 0, netCash: 0, voidCount: 0, voidAmount: 0, list: [] };
      
      state.history.forEach(tx => {
        if (tx.status === 'VOID') {
          s.voidCount++;
          s.voidAmount += tx.totalAmount;
        } else {
          if (tx.paymentMethod === 'CASH') s.cash += tx.totalAmount;
          if (tx.paymentMethod === 'ONLINE') s.online += tx.totalAmount;
          if (tx.paymentMethod === 'CREDIT') { s.credit += tx.totalAmount; s.list.push(tx); }
        }
      });

      state.expenses.forEach(ex => s.expenseTotal += ex.amount);
      s.netCash = s.cash - s.expenseTotal;
      state.stats = s;
    }

    function getCartSubtotal() { return Object.values(state.cart).reduce((sum, c) => sum + (c.item.price * c.qty), 0); }
    function getDiscountAmount() {
      const sub = getCartSubtotal();
      if(state.discount.type === 'fixed') return state.discount.value;
      if(state.discount.type === 'percent') return Math.round(sub * (state.discount.value / 100));
      return 0;
    }
    function getCartTotal() { return Math.max(0, getCartSubtotal() - getDiscountAmount()); }

    window.handleTap = (menuId) => { 
      const item = state.menu.find(m => m.id === menuId);
      const towedBy = item.isTowable ? state.towingMachine : null;
      const cartKey = towedBy ? `${menuId}_${towedBy}` : `${menuId}_none`;

      if (state.cart[cartKey]) state.cart[cartKey].qty += 1;
      else state.cart[cartKey] = { item, qty: 1, towedBy };
      render(); 
    };

    window.updateQty = (cartKey, delta) => {
      if (!state.cart[cartKey]) return;
      state.cart[cartKey].qty += delta;
      if (state.cart[cartKey].qty <= 0) delete state.cart[cartKey];
      if (Object.keys(state.cart).length === 0) state.discount = { type: 'none', value: 0 };
      render();
    };

    window.setJetski = (num) => { state.activeJetski = num; render(); };
    window.setTowingMachine = (machine) => { state.towingMachine = machine; render(); };
    
    window.toggleCustomerModal = (isOpen) => { state.customerModalOpen = isOpen; render(); };
    window.toggleCreditModal = (isOpen) => { state.creditModalOpen = isOpen; render(); };
    window.toggleDiscountModal = (isOpen) => { state.discountModalOpen = isOpen; render(); };

    window.saveCustomerInfo = () => {
      state.customer.name = document.getElementById('custName').value;
      state.customer.phone = document.getElementById('custPhone').value;
      state.customerModalOpen = false; render();
    };

    window.applyDiscount = (type) => {
      const val = parseFloat(document.getElementById('discountInput').value) || 0;
      state.discount = val > 0 ? { type: type, value: val } : { type: 'none', value: 0 };
      state.discountModalOpen = false; render();
    };
    window.clearDiscount = () => { state.discount = { type: 'none', value: 0 }; state.discountModalOpen = false; render(); }

    window.processCheckout = async (method) => {
      const total = getCartTotal();
      const subtotal = getCartSubtotal();
      if (subtotal === 0) return;

      let refText = '';
      if (method === 'CREDIT') {
        refText = document.getElementById('creditInput').value;
        if (!refText) { alert("Please enter a reference location or name."); return; }
      }

      const receiptId = 'INV-' + Math.floor(10000 + Math.random() * 90000);
      await db.transactions.add({
        receiptId: receiptId,
        timestamp: new Date().toISOString(),
        totalAmount: total,
        discountAmount: getDiscountAmount(),
        paymentMethod: method,
        reference: refText,
        customerName: state.customer.name,
        customerPhone: state.customer.phone,
        items: JSON.stringify(state.cart),
        activeJetskiId: state.activeJetski,
        status: 'COMPLETED'
      });

      state.cart = {}; state.customer = { name: '', phone: '' }; state.discount = { type: 'none', value: 0 };
      state.creditModalOpen = false; state.activeJetski = state.activeJetski === 1 ? 2 : 1; 
      render();
    };

    window.voidTransaction = async (id) => {
      if (confirm("Are you sure you want to VOID this ticket?")) {
        await db.transactions.update(id, { status: 'VOID' }); await loadHistoryData(); render();
      }
    };

    window.addExpense = async () => { 
      const desc = document.getElementById('expDesc').value;
      const amt = parseFloat(document.getElementById('expAmt').value);
      if (!desc || !amt) return;
      await db.expenses.add({ timestamp: new Date().toISOString(), description: desc, amount: amt });
      await loadExpenseData(); render();
    };

    window.addOrUpdateMenuItem = async () => { 
      const name = document.getElementById('menuName').value;
      const price = parseFloat(document.getElementById('menuPrice').value);
      const isTowable = document.getElementById('menuTowable').checked;
      if (!name || !price) return;

      if (state.editingRideId) {
        await db.menu.update(state.editingRideId, { name, price, isTowable });
        state.editingRideId = null;
      } else {
        await db.menu.add({ name, price, isTowable });
      }
      await loadMenuData(); render();
    };

    window.editMenuItem = (id) => { state.editingRideId = id; render(); };
    window.cancelEditMenu = () => { state.editingRideId = null; render(); };
    window.deleteMenuItem = async (id) => { 
      if (confirm("Are you sure you want to delete this item?")) { await db.menu.delete(id); await loadMenuData(); render(); }
    };

    // Preview Handlers
    window.openPreview = (txId, isKOT = false) => { 
      state.previewTxId = txId; 
      state.isKOTPreview = isKOT;
      render(); 
    };
    window.closePreview = () => { state.previewTxId = null; render(); };

    function generateReceiptHTML(tx, isKOT = false) {
      const items = JSON.parse(tx.items);
      let itemsHtml = Object.values(items).map(c => `
        <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:12px; line-height:1.2; border-bottom: 1px dashed #ccc; padding-bottom: 4px;">
          <div style="flex:1; padding-right:5px;">
            <span style="font-weight:bold;">${c.qty}x ${c.item.name}</span>
            ${c.towedBy ? `<br><span style="font-size:10px; color:#333;">(Tow: ${c.towedBy})</span>` : ''}
          </div>
          ${!isKOT ? `<div style="font-weight:bold; text-align:right; width:50px;">₹${c.item.price * c.qty}</div>` : ''}
        </div>
      `).join('');

      return `
        <div class="receipt-container" id="printable-receipt">
          <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:10px;">
            <h2 style="margin:0; font-size:16px; font-weight:bold; text-transform:uppercase;">${isKOT ? 'RIDE KOT TICKET' : 'WATERSPORTS BILL'}</h2>
            <p style="margin:2px 0 0; font-size:10px;">ID: ${tx.receiptId}</p>
            <p style="margin:2px 0 0; font-size:10px; color:#333;">${new Date(tx.timestamp).toLocaleString()}</p>
          </div>
          ${(tx.customerName || tx.customerPhone) ? `
            <div style="margin-bottom:10px; font-size:11px; border-bottom:1px dotted #000; padding-bottom:6px;">
              ${tx.customerName ? `<div><strong>Cust:</strong> ${tx.customerName}</div>` : ''}
              ${tx.customerPhone ? `<div><strong>Ph:</strong> ${tx.customerPhone}</div>` : ''}
            </div>` : ''}
          <div style="margin-bottom:10px;">${itemsHtml}</div>
          ${!isKOT ? `
            ${tx.discountAmount > 0 ? `<div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px;"><span>Discount</span><span>-₹${tx.discountAmount}</span></div>` : ''}
            <div style="border-top:2px solid #000; padding-top:6px; display:flex; justify-content:space-between; font-size:15px; font-weight:bold;">
              <span>TOTAL</span><span>₹${tx.totalAmount}</span>
            </div>
            <div style="font-size: 10px; text-align: right; margin-top: 2px;">Mode: ${tx.paymentMethod}</div>
          ` : `<div style="border-top:2px solid #000; padding-top:6px; text-align:center; font-size:12px; font-weight:bold;">OPERATOR COPY</div>`}
          ${tx.reference ? `<div style="text-align:center; font-size:10px; margin-top:10px; padding: 4px; border: 1px dashed #000;">Ref: ${tx.reference}</div>` : ''}
        </div>`;
    }

    window.triggerDownload = (isKOT) => {
      const element = document.getElementById('printable-receipt');
      if (!element) return;

      const prefix = isKOT ? 'KOT' : 'Bill';
      const tx = state.history.find(t => t.id === state.previewTxId);
      
      html2pdf().set({ 
        margin: [2, 0, 2, 0], 
        filename: `${prefix}_${tx ? tx.receiptId : 'Receipt'}.pdf`,
        image: { type: 'jpeg', quality: 0.98 }, 
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: [80, 180], orientation: 'portrait' }
      }).from(element).save();
    };

    // Placeholder for future Bluetooth Thermal Printer integration
    window.printViaBluetooth = () => {
      alert("Bluetooth Printer integration is ready for the next version! You can connect your 80mm thermal printer via Web Bluetooth API here.");
    };

    window.setView = async (viewName) => {
      state.view = viewName;
      ['pos', 'history', 'expenses', 'dashboard', 'settings'].forEach(v => {
        const el = document.getElementById('nav-' + v);
        el.className = el.className.replace('nav-active', '').replace('nav-inactive', '');
        el.classList.add(state.view === v ? 'nav-active' : 'nav-inactive');
      });
      if (viewName === 'history') await loadHistoryData();
      if (viewName === 'expenses') await loadExpenseData();
      if (viewName === 'dashboard') await loadDashboardData();
      if (viewName === 'settings') { state.editingRideId = null; await loadMenuData(); }
      
      window.scrollTo(0, 0); 
      render();
    };

    function render() {
      const app = document.getElementById('app');
      const checkoutDock = document.getElementById('checkout-dock');
      const modals = document.getElementById('modals');
      
      let appHtml = `
        <div class="flex justify-center pt-6 pb-4 w-full border-b border-gray-200 mb-4">
          <img src="assets/kas.png" alt="KAS Logo" class="h-20 md:h-24 object-contain">
        </div>
      `;
      let dockHtml = '', modalHtml = '';

      if (state.view === 'pos') {
        const subtotal = getCartSubtotal();
        const discountAmt = getDiscountAmount();
        const total = getCartTotal();
        const cartItems = Object.entries(state.cart);

        appHtml += `
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-white p-3 border border-gray-300 rounded shadow-sm flex flex-col justify-between">
              <div class="text-[10px] font-bold text-gray-500 mb-2 uppercase tracking-wider">Active Jetski</div>
              <div class="flex gap-2">
                <button onclick="setJetski(1)" class="flex-1 py-2 text-base font-bold rounded transition-colors ${state.activeJetski === 1 ? 'bg-green-600 text-white border-green-700' : 'bg-gray-100 text-gray-700 border border-gray-300'}">1</button>
                <button onclick="setJetski(2)" class="flex-1 py-2 text-base font-bold rounded transition-colors ${state.activeJetski === 2 ? 'bg-green-600 text-white border-green-700' : 'bg-gray-100 text-gray-700 border border-gray-300'}">2</button>
              </div>
            </div>
            <div class="bg-white p-3 border border-gray-300 rounded shadow-sm flex flex-col justify-between">
              <div class="text-[10px] font-bold text-gray-500 mb-2 uppercase tracking-wider">Towing Machine</div>
              <div class="flex gap-2">
                <button onclick="setTowingMachine('JETSKI')" class="flex-1 py-2 text-sm font-bold rounded transition-colors ${state.towingMachine === 'JETSKI' ? 'bg-blue-600 text-white border-blue-700' : 'bg-gray-100 text-gray-700 border border-gray-300'}">Jetski</button>
                <button onclick="setTowingMachine('SPEEDBOAT')" class="flex-1 py-2 text-sm font-bold rounded transition-colors ${state.towingMachine === 'SPEEDBOAT' ? 'bg-blue-600 text-white border-blue-700' : 'bg-gray-100 text-gray-700 border border-gray-300'}">Boat</button>
              </div>
            </div>
          </div>
          
          <div class="grid grid-cols-2 gap-3 mb-4">
            ${state.menu.map(item => `
              <button onclick="handleTap(${item.id})" class="bg-white p-4 rounded border border-gray-300 shadow-sm active:bg-blue-50 flex flex-col items-center justify-center min-h-[85px] relative">
                <span class="text-sm font-bold text-gray-900 text-center leading-tight">${item.name}</span>
                <span class="mt-1 text-sm font-bold text-blue-600">₹${item.price}</span>
                ${item.isTowable ? `<div class="absolute top-2 right-2 text-[10px] font-bold text-gray-400"><i class="fa-solid fa-link"></i></div>` : ''}
              </button>
            `).join('')}
          </div>

          ${cartItems.length > 0 ? `
            <div class="bg-blue-50 rounded border border-blue-200 p-3 mb-4">
              <div class="flex justify-between items-center border-b border-blue-200 pb-2 mb-2">
                <h3 class="text-xs font-bold text-blue-800 uppercase tracking-wide">Current Order</h3>
              </div>
              ${cartItems.map(([key, data]) => `
                <div class="flex justify-between items-center mb-2 last:mb-0 bg-white p-2 rounded border border-gray-200 shadow-sm">
                  <div class="flex-1 leading-tight pr-2">
                    <div class="font-bold text-sm text-gray-900">${data.item.name}</div>
                    ${data.towedBy ? `<div class="text-[11px] font-semibold text-gray-500 mt-0.5">Towed by: ${data.towedBy}</div>` : ''}
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="updateQty('${key}', -1)" class="w-8 h-8 rounded bg-gray-200 text-gray-700 font-bold flex items-center justify-center text-lg">-</button>
                    <span class="font-bold text-base w-6 text-center">${data.qty}</span>
                    <button onclick="updateQty('${key}', 1)" class="w-8 h-8 rounded bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-lg">+</button>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        `;

        dockHtml = `
          <div class="p-4 bg-white w-full border-b border-gray-200">
            <div class="flex justify-between items-end mb-4">
              <div class="flex gap-2">
                <button onclick="toggleCustomerModal(true)" class="flex items-center gap-2 text-xs bg-gray-100 px-3 py-2 rounded border border-gray-300 font-bold text-gray-700 active:bg-gray-200">
                  <i class="fa-solid fa-user"></i> ${state.customer.name ? state.customer.name.substring(0,8)+'...' : 'Customer'}
                </button>
                <button onclick="toggleDiscountModal(true)" class="flex items-center gap-2 text-xs ${discountAmt > 0 ? 'bg-blue-100 border-blue-300 text-blue-800' : 'bg-gray-100 border-gray-300 text-gray-700'} px-3 py-2 rounded border font-bold active:bg-gray-200">
                  <i class="fa-solid fa-tag"></i> ${discountAmt > 0 ? '-₹'+discountAmt : 'Discount'}
                </button>
              </div>
              <div class="text-right">
                ${discountAmt > 0 ? `<div class="text-xs font-bold text-gray-400 line-through">₹${subtotal}</div>` : ''}
                <div class="flex items-baseline justify-end gap-2">
                  <span class="text-xs font-bold text-gray-500 uppercase tracking-wide">Total</span>
                  <span class="text-3xl font-black text-green-700 tracking-tight leading-none">₹${total}</span>
                </div>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="processCheckout('CASH')" class="bg-green-600 active:bg-green-700 text-white py-4 font-bold text-sm rounded shadow flex flex-col justify-center items-center gap-1"><i class="fa-solid fa-money-bill-wave text-lg"></i> CASH</button>
              <button onclick="processCheckout('ONLINE')" class="bg-blue-600 active:bg-blue-700 text-white py-4 font-bold text-sm rounded shadow flex flex-col justify-center items-center gap-1"><i class="fa-solid fa-qrcode text-lg"></i> ONLINE</button>
              <button onclick="toggleCreditModal(true)" class="bg-yellow-500 active:bg-yellow-600 text-gray-900 py-4 font-bold text-sm rounded shadow flex flex-col justify-center items-center gap-1"><i class="fa-solid fa-hotel text-lg"></i> CREDIT</button>
            </div>
          </div>
        `;

        if (state.customerModalOpen) {
          modalHtml += `
            <div class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded p-6 w-full max-w-sm shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-gray-900 border-b pb-2">Customer Details</h2>
                <input id="custName" type="text" placeholder="Name (Optional)" value="${state.customer.name}" class="w-full border border-gray-400 p-3 rounded mb-3 focus:outline-none focus:border-blue-500">
                <input id="custPhone" type="tel" placeholder="Phone (Optional)" value="${state.customer.phone}" class="w-full border border-gray-400 p-3 rounded mb-5 focus:outline-none focus:border-blue-500">
                <div class="flex gap-3">
                  <button onclick="toggleCustomerModal(false)" class="flex-1 p-3 bg-gray-200 text-gray-800 font-bold rounded border border-gray-300">Cancel</button>
                  <button onclick="saveCustomerInfo()" class="flex-1 p-3 bg-blue-600 text-white font-bold rounded">Save Info</button>
                </div>
              </div>
            </div>`;
        }
        if (state.creditModalOpen) {
           modalHtml += `
            <div class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded p-6 w-full max-w-sm shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-gray-900 border-b pb-2">Credit Reference</h2>
                <input id="creditInput" type="text" placeholder="Hotel / Room / Name" class="w-full border border-gray-400 p-3 rounded text-lg mb-5 focus:outline-none focus:border-blue-500" autofocus>
                <div class="flex gap-3">
                  <button onclick="toggleCreditModal(false)" class="flex-1 p-3 bg-gray-200 text-gray-800 font-bold rounded border border-gray-300">Cancel</button>
                  <button onclick="processCheckout('CREDIT')" class="flex-1 p-3 bg-yellow-500 text-gray-900 font-bold rounded border border-yellow-600">Complete</button>
                </div>
              </div>
            </div>`;
        }
        if (state.discountModalOpen) {
           modalHtml += `
            <div class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded p-6 w-full max-w-sm shadow-xl">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-bold text-gray-900">Apply Discount</h2>
                    <button onclick="clearDiscount()" class="text-red-600 text-xs font-bold bg-red-100 px-3 py-1.5 rounded border border-red-200">Clear</button>
                </div>
                <input id="discountInput" type="number" placeholder="Enter Amount" class="w-full border border-gray-400 p-3 rounded text-lg mb-5 focus:outline-none focus:border-blue-500" autofocus>
                <div class="flex gap-2">
                  <button onclick="toggleDiscountModal(false)" class="p-3 bg-gray-200 text-gray-800 font-bold rounded border border-gray-300">Cancel</button>
                  <button onclick="applyDiscount('fixed')" class="flex-1 p-3 bg-blue-600 text-white font-bold rounded">₹ Flat</button>
                  <button onclick="applyDiscount('percent')" class="flex-1 p-3 bg-blue-600 text-white font-bold rounded">% Off</button>
                </div>
              </div>
            </div>`;
        }
      } 
      
      else if (state.view === 'history') {
        appHtml += `
          <h2 class="text-xl font-bold text-gray-900 mb-3 border-b border-gray-300 pb-2">Today's Tickets</h2>
          <div class="bg-white rounded border border-gray-300 shadow-sm overflow-hidden mb-6">
            ${state.history.length === 0 ? '<p class="p-6 text-center text-gray-500 font-medium">No sales recorded today.</p>' : 
              state.history.map((tx, index) => {
                const itemsStr = Object.values(JSON.parse(tx.items)).map(c => `${c.qty}x ${c.item.name}`).join(', ');
                return `
                <div class="p-4 border-b border-gray-200 last:border-0 ${tx.status === 'VOID' ? 'bg-red-50 opacity-75' : ''}">
                  <div class="flex justify-between items-start mb-2">
                    <div class="flex-1">
                      <div class="font-bold text-lg text-gray-900">₹${tx.totalAmount} <span class="text-xs font-bold px-2 py-1 rounded bg-gray-200 text-gray-700 align-middle ml-1 border border-gray-300">${tx.paymentMethod}</span></div>
                      <div class="text-xs text-gray-500 mt-1">${new Date(tx.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} ${tx.reference ? '• Ref: ' + tx.reference : ''}</div>
                      ${tx.customerName ? `<div class="text-xs text-blue-700 font-bold mt-1"><i class="fa-solid fa-user mr-1"></i>${tx.customerName}</div>` : ''}
                    </div>
                    ${tx.status === 'COMPLETED' && index === 0 ? `<button onclick="voidTransaction(${tx.id})" class="bg-red-100 text-red-700 px-3 py-1.5 rounded text-xs font-bold border border-red-300 active:bg-red-200">VOID</button>` : 
                     tx.status === 'VOID' ? '<span class="text-red-600 font-bold text-xs bg-red-100 px-2 py-1 rounded border border-red-200">VOIDED</span>' : ''}
                  </div>
                  <div class="text-sm font-medium text-gray-700 mb-3">${itemsStr}</div>
                  ${tx.status === 'COMPLETED' ? `
                    <div class="grid grid-cols-2 gap-2">
                      <button onclick="openPreview(${tx.id}, false)" class="py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded font-bold text-xs border border-blue-200 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-file-invoice"></i> View/Print Bill
                      </button>
                      <button onclick="openPreview(${tx.id}, true)" class="py-2 bg-yellow-50 text-yellow-800 hover:bg-yellow-100 rounded font-bold text-xs border border-yellow-200 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-ticket"></i> View/Print KOT
                      </button>
                    </div>
                  ` : ''}
                </div>
              `}).join('')}
          </div>
        `;
        
        // FIXED PREVIEW MODAL: Now renders the receipt directly on screen so html2pdf can always see it cleanly!
        if (state.previewTxId) {
          const previewTx = state.history.find(t => t.id === state.previewTxId);
          modalHtml += `
            <div class="fixed inset-0 bg-black/80 flex flex-col items-center justify-center p-4 z-50 overflow-y-auto">
              <div class="w-full flex justify-between items-center mb-3 max-w-xs text-white">
                <span class="font-bold text-base">${state.isKOTPreview ? 'KOT Preview' : 'Bill Preview'}</span>
                <button onclick="closePreview()" class="w-8 h-8 bg-gray-800 rounded-full text-lg flex items-center justify-center">&times;</button>
              </div>
              
              <!-- VISIBLE RECEIPT CONTAINER (Guarantees zero blank white pages) -->
              <div class="bg-white p-2 rounded shadow-2xl mb-4 max-h-[60vh] overflow-y-auto">
                ${generateReceiptHTML(previewTx, state.isKOTPreview)}
              </div>

              <div class="w-full max-w-xs flex flex-col gap-2.5">
                <button onclick="triggerDownload(${state.isKOTPreview})" class="w-full py-3 bg-blue-600 text-white rounded font-bold text-sm shadow flex items-center justify-center gap-2">
                  <i class="fa-solid fa-download"></i> Download PDF
                </button>
                <button onclick="printViaBluetooth()" class="w-full py-3 bg-purple-600 text-white rounded font-bold text-sm shadow flex items-center justify-center gap-2">
                  <i class="fa-solid fa-bluetooth"></i> Print via Bluetooth (Next Gen)
                </button>
                <button onclick="closePreview()" class="w-full py-2 bg-gray-200 text-gray-800 rounded font-bold text-xs">
                  Close Preview
                </button>
              </div>
            </div>`;
        }
      }

      else if (state.view === 'settings') {
        const editingItem = state.editingRideId ? state.menu.find(m => m.id === state.editingRideId) : null;
        appHtml += `
          <h2 class="text-xl font-bold text-gray-900 mb-3 border-b border-gray-300 pb-2">Menu Setup</h2>
          
          <div class="bg-white p-4 rounded border ${editingItem ? 'border-yellow-400' : 'border-gray-300'} shadow-sm mb-6">
            <h3 class="font-bold text-sm mb-3 text-gray-800">${editingItem ? 'Editing Mode Active' : 'Add New Item'}</h3>
            
            <input id="menuName" type="text" placeholder="Item Name" value="${editingItem ? editingItem.name : ''}" class="w-full border border-gray-400 p-3 rounded mb-3 focus:border-blue-500 outline-none">
            <input id="menuPrice" type="number" placeholder="Price (₹)" value="${editingItem ? editingItem.price : ''}" class="w-full border border-gray-400 p-3 rounded mb-4 focus:border-blue-500 outline-none font-bold">
            
            <label class="flex items-center gap-3 mb-4 p-3 bg-gray-50 border border-gray-200 rounded">
              <input type="checkbox" id="menuTowable" ${editingItem && editingItem.isTowable ? 'checked' : ''} class="w-5 h-5 accent-blue-600 cursor-pointer">
              <span class="text-sm font-bold text-gray-700">Needs JetSki/Boat to Tow?</span>
            </label>
            
            <div class="flex gap-2">
              ${editingItem ? `<button onclick="cancelEditMenu()" class="p-3 bg-gray-200 text-gray-800 font-bold rounded border border-gray-300 w-1/3">Cancel</button>` : ''}
              <button onclick="addOrUpdateMenuItem()" class="flex-1 bg-gray-900 text-white py-3 rounded font-bold">
                ${editingItem ? 'Update Item' : 'Save to Menu'}
              </button>
            </div>
          </div>

          <h3 class="font-bold text-gray-500 uppercase tracking-wide text-xs mb-2">Live Menu Options</h3>
          <div class="bg-white rounded border border-gray-300 shadow-sm overflow-hidden mb-6">
            ${state.menu.map(item => `
              <div class="p-4 border-b border-gray-200 last:border-0 flex justify-between items-center ${state.editingRideId === item.id ? 'bg-yellow-50' : ''}">
                <div>
                  <div class="font-bold text-gray-900">${item.name}</div>
                  <div class="text-sm text-blue-700 font-bold mt-1">₹${item.price} ${item.isTowable ? '<span class="ml-2 text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-300">TOWED</span>' : ''}</div>
                </div>
                <div class="flex gap-2">
                  <button onclick="editMenuItem(${item.id})" class="text-gray-600 p-2 bg-gray-100 border border-gray-300 rounded"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deleteMenuItem(${item.id})" class="text-red-600 p-2 bg-red-50 border border-red-200 rounded"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      
      else if (state.view === 'expenses') {
        appHtml += `
          <h2 class="text-xl font-bold text-gray-900 mb-3 border-b border-gray-300 pb-2">Log Expense</h2>
          <div class="bg-white p-4 rounded border border-gray-300 shadow-sm mb-6">
            <input id="expDesc" type="text" placeholder="Expense Reason (e.g., Fuel)" class="w-full border border-gray-400 p-3 rounded mb-3 focus:border-blue-500 outline-none">
            <input id="expAmt" type="number" placeholder="Amount (₹)" class="w-full border border-gray-400 p-3 rounded mb-4 focus:border-blue-500 outline-none font-bold">
            <button onclick="addExpense()" class="w-full bg-red-600 text-white py-3 rounded font-bold border border-red-700">Deduct Cash</button>
          </div>
          <h3 class="font-bold text-gray-500 uppercase tracking-wide text-xs mb-2">Today's Deductions</h3>
          <div class="bg-white rounded border border-gray-300 shadow-sm overflow-hidden mb-6">
            ${state.expenses.length === 0 ? '<p class="p-6 text-center text-gray-500 font-medium">No expenses logged.</p>' : 
              state.expenses.map(ex => `
                <div class="p-4 border-b border-gray-200 last:border-0 flex justify-between items-center">
                  <span class="font-bold text-gray-800">${ex.description}</span>
                  <span class="font-black text-red-600 bg-red-50 px-2 py-1 rounded border border-red-200">-₹${ex.amount}</span>
                </div>
              `).join('')}
          </div>
        `;
      }

      else if (state.view === 'dashboard') {
        appHtml += `
          <h2 class="text-xl font-bold text-gray-900 mb-3 border-b border-gray-300 pb-2">End of Day Reporting</h2>
          
          <div class="bg-white p-4 rounded border border-gray-300 shadow-sm mb-4">
            <h3 class="font-bold text-gray-800 border-b border-gray-200 pb-2 mb-3">Cash Drawer</h3>
            <div class="flex justify-between items-center mb-3">
              <span class="text-gray-600 font-bold">Cash Received (Sales)</span>
              <span class="font-bold text-gray-900 text-lg">₹${state.stats.cash}</span>
            </div>
            <div class="flex justify-between items-center mb-4">
              <span class="text-gray-600 font-bold">Cash Deductions (Expenses)</span>
              <span class="font-bold text-red-600 text-lg">-₹${state.stats.expenseTotal}</span>
            </div>
            <div class="flex justify-between items-center bg-green-50 border border-green-200 p-3 rounded">
              <span class="font-bold text-green-900 text-sm uppercase tracking-wide">Net Cash In Drawer</span>
              <span class="font-black text-green-700 text-2xl">₹${state.stats.netCash}</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-blue-50 border border-blue-200 p-4 rounded text-center">
              <div class="text-[11px] text-blue-800 font-bold uppercase tracking-wider mb-1">UPI Collected</div>
              <div class="text-xl font-black text-blue-700">₹${state.stats.online}</div>
            </div>
            <div class="bg-gray-100 border border-gray-300 p-4 rounded text-center">
              <div class="text-[11px] text-gray-700 font-bold uppercase tracking-wider mb-1">Total Sales Value</div>
              <div class="text-xl font-black text-gray-900">₹${state.stats.cash + state.stats.online}</div>
            </div>
          </div>

          <div class="bg-red-50 border border-red-200 rounded p-4 mb-6 shadow-sm">
             <h3 class="font-bold text-red-800 border-b border-red-200 pb-2 mb-3 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> Needs Attention</h3>
             
             <div class="flex justify-between items-center mb-3">
              <span class="text-red-900 font-medium">Credits Pending</span>
              <div class="text-right">
                 <div class="font-bold text-red-900 text-lg">₹${state.stats.credit}</div>
                 <div class="text-xs text-red-700">${state.stats.list.length} transactions</div>
              </div>
            </div>

            <div class="flex justify-between items-center">
              <span class="text-red-900 font-medium">Voided Tickets</span>
              <div class="text-right">
                 <div class="font-bold text-red-900 text-lg">₹${state.stats.voidAmount}</div>
                 <div class="text-xs text-red-700">${state.stats.voidCount} transactions</div>
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = appHtml;
      checkoutDock.innerHTML = dockHtml;
      modals.innerHTML = modalHtml;
    }

    boot();
  </script>
</body>
</html>
