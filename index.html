<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F3F4F6">
  <title>KAS POS — Karde Adventure Sports</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --kas-blue: #1769d1;
      --kas-green: #159447;
      --kas-yellow: #f0b900;
      --page-bg: #f5f7f9;
      --footer-height: 72px;

      /* Outdoor High Contrast palette */
      --outdoor-blue: #0B57D0;
      --outdoor-green: #08783E;
      --outdoor-orange: #B86000;
      --outdoor-red: #C62828;
      --outdoor-text: #111827;
      --outdoor-muted: #4B5563;
      --outdoor-border: #B8C2CF;
      --outdoor-bg: #F3F4F6;
      --outdoor-card: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      user-select: none;
      touch-action: manipulation;
      color: #17202a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: calc(var(--footer-height) + env(safe-area-inset-bottom, 0px));
    }

    input, textarea, select {
      user-select: text;
      touch-action: auto;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(.985);
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 12px 16px;
    }

    .compact-header {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #dfe3e7;
      margin-bottom: 10px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
    }

    .brand-mini img {
      width: 54px;
      height: 42px;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      line-height: 1.05;
      min-width: 0;
    }

    .brand-title strong {
      display: block;
      font-size: 13px;
      letter-spacing: .02em;
    }

    .brand-title span {
      display: block;
      margin-top: 3px;
      color: #737b85;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .active-machine-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      background: #eaf7ef;
      border: 1px solid #bce4c9;
      color: #11783b;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #16a34a;
      border-radius: 50%;
      display: inline-block;
    }

    .control-strip {
      background: #fff;
      border: 1px solid #d8dde3;
      border-radius: 10px;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 8px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .control-label {
      color: #69727d;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .segmented {
      display: flex;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .segmented button {
      min-height: 38px;
      flex: 1;
      border: 1px solid #d2d7dd;
      border-radius: 7px;
      background: #f4f5f7;
      color: #3d4651;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .segmented button.active-machine {
      background: #159447;
      border-color: #159447;
      color: #fff;
    }

    .segmented button.active-tow {
      background: #1769d1;
      border-color: #1769d1;
      color: #fff;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 2px 8px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #6c7580;
    }

    .section-hint {
      font-size: 10px;
      font-weight: 700;
      color: #9aa1a9;
    }

    .ride-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .ride-button {
      min-height: 104px;
      position: relative;
      overflow: hidden;
      background: #fff;
      border: 1px solid #d7dce2;
      border-radius: 10px;
      padding: 13px 10px;
      padding-right: 86px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.035);
      transition: border-color .12s, background .12s, transform .06s;
    }

    .ride-button.selected {
      background: #f5f9ff;
      border-color: #6fa5e5;
      box-shadow: 0 0 0 1px rgba(37,99,235,.08);
    }

    .ride-button:active {
      background: #edf5ff;
      border-color: #8db8ed;
    }

    .ride-name {
      display: block;
      padding-right: 28px;
      font-size: 15px;
      line-height: 1.15;
      font-weight: 900;
      color: #141b23;
    }

    .ride-price {
      display: block;
      margin-top: 8px;
      color: #1769d1;
      font-size: 14px;
      font-weight: 900;
    }

    .tow-icon {
      position: absolute;
      bottom: 10px;
      right: 10px;
      color: #9aa2aa;
      font-size: 11px;
    }

    .ride-qty-control {
      position: absolute;
      right: 8px;
      top: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
      background: #1769d1;
      border: 2px solid #fff;
      border-radius: 9px;
      padding: 3px;
      box-shadow: 0 2px 8px rgba(23,105,209,.28);
      z-index: 5;
    }

    .qty-mini {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #1769d1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .qty-number {
      min-width: 24px;
      text-align: center;
      color: #fff;
      font-size: 12px;
      font-weight: 950;
    }

    .empty-order {
      margin-top: 10px;
      border: 1px dashed #cbd2d9;
      border-radius: 9px;
      padding: 10px;
      text-align: center;
      color: #8a929b;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255,255,255,.55);
    }

    #pos-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: rgba(255,255,255,.98);
      border-top: 1px solid #cfd5db;
      box-shadow: 0 -5px 18px rgba(0,0,0,.09);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #checkout-dock {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .checkout-panel {
      padding: 8px 12px 9px;
      border-bottom: 1px solid #e1e5e9;
    }

    .checkout-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
    }

    .order-preview {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .order-count {
      flex-shrink: 0;
      background: #eef2f6;
      color: #56606b;
      border: 1px solid #dce1e6;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 10px;
      font-weight: 900;
    }

    .order-items-text {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 11px;
      color: #3f4852;
      font-weight: 800;
    }

    .total-box {
      text-align: right;
      white-space: nowrap;
    }

    .total-label {
      display: block;
      color: #7a838d;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .total-value {
      display: block;
      color: #14763b;
      font-size: 23px;
      line-height: 1;
      font-weight: 950;
    }

    .checkout-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 7px;
    }

    .checkout-actions.collapsed {
      display: none;
    }

    .more-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }

    .more-button {
      min-height: 28px;
      border: 1px solid #d5dbe1;
      background: #fff;
      color: #59636e;
      border-radius: 6px;
      padding: 0 9px;
      font-size: 10px;
      font-weight: 900;
    }

    .secondary-action {
      min-height: 31px;
      border: 1px solid #d5dbe1;
      background: #f4f5f7;
      color: #4d5660;
      border-radius: 6px;
      padding: 0 9px;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .secondary-action.has-value {
      background: #edf5ff;
      border-color: #b8d4f6;
      color: #1559a8;
    }

    .payment-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .pay-button {
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      font-weight: 950;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.10);
      cursor: pointer;
    }

    .pay-button i { font-size: 15px; }

    .pay-button:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none !important;
    }

    #toast-root {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--footer-height) + 8px);
      z-index: 80;
      display: flex;
      justify-content: center;
      pointer-events: none;
      padding: 0 12px;
    }

    .success-toast {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #17231b;
      color: #fff;
      border-radius: 999px;
      padding: 9px 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
      font-size: 11px;
      font-weight: 900;
      animation: toastIn .15s ease-out;
    }

    .success-toast i { color: #35c66c; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pay-cash { background: #159f4c; }
    .pay-online { background: #2563df; }
    .pay-credit { background: #efb800; color: #151515; }

    .empty-checkout {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
    }

    .empty-checkout-text strong {
      display: block;
      font-size: 11px;
      color: #4e5862;
    }

    .empty-checkout-text span {
      display: block;
      margin-top: 2px;
      font-size: 9px;
      color: #9299a1;
      font-weight: 700;
    }

    .empty-checkout-total {
      color: #8c949d;
      font-size: 21px;
      font-weight: 950;
    }

    .bottom-nav {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: #fff;
    }

    .nav-button {
      min-height: 58px;
      border: 0;
      border-top: 3px solid transparent;
      background: #fff;
      color: #737b84;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
    }

    .nav-button i { font-size: 17px; }

    .nav-button span {
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .nav-button.active {
      color: #2563df;
      border-top-color: #2563df;
      background: #f0f6ff;
    }

    .screen-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #d9dee3;
      padding: 4px 2px 9px;
      margin-bottom: 10px;
    }

    .screen-heading h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 950;
    }

    .screen-heading p {
      margin: 2px 0 0;
      color: #818993;
      font-size: 10px;
      font-weight: 700;
    }

    .surface {
      background: #fff;
      border: 1px solid #d7dce2;
      border-radius: 9px;
      box-shadow: 0 1px 2px rgba(0,0,0,.035);
    }

    .form-input {
      width: 100%;
      min-height: 45px;
      border: 1px solid #cfd5db;
      border-radius: 7px;
      padding: 0 12px;
      background: #fff;
      color: #17202a;
      font-size: 15px;
      outline: none;
    }

    .form-input:focus {
      border-color: #6da5e8;
      box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }

    .primary-btn, .danger-btn, .neutral-btn {
      min-height: 43px;
      border-radius: 7px;
      padding: 0 14px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary-btn { background: #1769d1; color: #fff; }
    .danger-btn { background: #d92d20; color: #fff; }
    .neutral-btn { background: #eef0f2; border-color: #d4d9de; color: #3f4750; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(12,18,25,.70);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: #fff;
      border-radius: 11px;
      padding: 16px;
      box-shadow: 0 18px 60px rgba(0,0,0,.28);
    }

    .settings-section-title {
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #68717c;
      margin-bottom: 8px;
    }

    .history-filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 10px;
    }

    .history-filter {
      min-height: 38px;
      border: 1px solid #d4dae0;
      background: #fff;
      color: #626c76;
      border-radius: 7px;
      font-size: 9px;
      font-weight: 950;
      cursor: pointer;
    }

    .history-filter.active {
      background: #1769d1;
      border-color: #1769d1;
      color: #fff;
    }

    .machine-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .machine-tag {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      padding: 0 6px;
      border-radius: 5px;
      background: #eef5ff;
      border: 1px solid #cfe0f7;
      color: #1559a8;
      font-size: 8px;
      font-weight: 950;
    }

    .tow-transfer {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 7px;
    }

    .tow-transfer-label {
      color: #7c858f;
      font-size: 9px;
      font-weight: 800;
      margin-right: 2px;
    }

    .tow-transfer button {
      min-height: 27px;
      border: 1px solid #d2d8de;
      background: #f5f6f7;
      color: #5d6670;
      border-radius: 5px;
      padding: 0 7px;
      font-size: 8px;
      font-weight: 950;
    }

    .tow-transfer button.active {
      background: #1769d1;
      border-color: #1769d1;
      color: #fff;
    }

    .expense-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .expense-method {
      min-height: 40px;
      border: 1px solid #d2d8de;
      background: #f5f6f7;
      color: #5d6670;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 950;
    }

    .expense-method.active {
      background: #1769d1;
      border-color: #1769d1;
      color: #fff;
    }

    .settings-machine-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .settings-hint {
      margin-top: 7px;
      color: #858d96;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.4;
    }

    .receipt-container {
      width: 302px;
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      color: #000;
      box-sizing: border-box;
    }

    .receipt-logo {
      display: block;
      width: 150px;
      max-width: 90%;
      max-height: 58px;
      height: auto;
      object-fit: contain;
      margin: 0 auto 5px;
    }

    .receipt-business {
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .receipt-subtitle {
      text-align: center;
      font-size: 8px;
      margin-top: 2px;
      letter-spacing: .04em;
    }

    .receipt-divider {
      border-top: 1px dashed #000;
      margin: 8px 0;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    @media (min-width: 640px) {
      .app-shell { padding-left: 16px; padding-right: 16px; }
      .ride-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 380px) {
      .control-strip { grid-template-columns: 1fr; }
      .ride-button { min-height: 108px; padding-right: 92px; }
      .ride-qty-control { right: 6px; top: 6px; }
      .brand-title strong { font-size: 11px; }
      .active-machine-pill { padding: 6px 8px; }
      .secondary-action { padding: 0 7px; }
      .pay-button { font-size: 11px; }
    }
    /* V3 usability/reporting/thermal-print additions */
    .period-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 9px;
    }

    .compact-filter-input {
      min-height: 40px;
      font-size: 12px;
      font-weight: 850;
    }

    .setup-label {
      display: block;
      font-size: 10px;
      font-weight: 900;
      color: #4f5862;
      margin-bottom: 6px;
    }

    .machine-choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .machine-choice-grid button {
      min-height: 76px;
      border: 1px solid #cfd8e3;
      border-radius: 10px;
      background: #f7f9fc;
      color: #273444;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
    }

    .machine-choice-grid button i {
      color: #1769d1;
      font-size: 20px;
    }

    .machine-choice-grid button strong {
      font-size: 12px;
      font-weight: 950;
    }

    @media (max-width: 430px) {
      .period-tabs { gap: 4px; }
      .period-tabs .history-filter { font-size: 8px; padding: 0 3px; }
    }


    /* V4: simple reusable-token open bills */
    .open-bill-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    .sale-mode-card {
      min-height: 46px;
      border: 1px solid #d7dce2;
      border-radius: 9px;
      background: #fff;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .sale-mode-card.open {
      background: #eef7ff;
      border-color: #b8d5f5;
    }

    .sale-mode-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #edf1f5;
      color: #65717e;
    }

    .sale-mode-card.open .sale-mode-icon {
      background: #1769d1;
      color: #fff;
    }

    .sale-mode-copy { min-width: 0; line-height: 1.1; }
    .sale-mode-copy strong { display:block; font-size:12px; font-weight:950; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

      expenses: '++id, timestamp, description, amount',

      creditModalOpen: false,
      discountModalOpen: false,
      groupRateModalOpen: false,
      groupRateDrafts: {},
      machinePickerItemId: null,
      successTxId: null,
      moreOpen: false,
      checkoutLocked: false,
      toastTimer: null,
      settings: structuredClone(DEFAULT_SETTINGS),
      settingsLoaded: false,
      highestInvoiceNumber: 0,
      previewTxId: null,
      isKOTPreview: false,
      editingRideId: null,
      customer: { name: '', phone: '' },
      discount: { type: 'none', value: 0 },
      stats: emptyStats()
    };

    const $ = id => document.getElementById(id);

    function emptyStats() {
      return {
        cash: 0,
        online: 0,
        credit: 0,
        grossSales: 0,
        expenseTotal: 0,
        cashExpenseTotal: 0,
        onlineExpenseTotal: 0,
        netCash: 0,
        netOnline: 0,
        netCollected: 0,
        completedCount: 0,
        voidCount: 0,
        voidAmount: 0,
        list: []
      };
    }

    function escapeHTML(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function money(value) {
      return '₹' + Number(value || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }

    function localDateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseLocalDate(value) {
      if (!value) return new Date();
      const [y, m, d] = String(value).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0, 0);
    }

    function startOfDay(date) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function addDays(date, days) {
      const d = new Date(date);
      d.setDate(d.getDate() + days);
      return d;
    }

    function getFinancialYear(date = new Date()) {
      const d = new Date(date);
      const y = d.getFullYear();
      const startYear = d.getMonth() >= 3 ? y : y - 1;
      return `${String(startYear).slice(-2)}-${String(startYear + 1).slice(-2)}`;
    }

    function financialYearStart(fy) {
      const first = Number(String(fy).split('-')[0]);
      const fullYear = first >= 70 ? 1900 + first : 2000 + first;
      return new Date(fullYear, 3, 1, 0, 0, 0, 0);
    }

    function formatInvoiceId(fy, sequence) {
      return `INV/${fy}/${String(sequence).padStart(5, '0')}`;
    }

    function receiptSequence(receiptId, fy) {
      const escaped = String(fy).replace('-', '\\-');
      const match = String(receiptId || '').match(new RegExp(`^INV/${escaped}/(\\d+)$`, 'i'));
      return match ? Number(match[1]) : 0;
    }

    function machineName(num) {
      return state.settings.jetskiNames[num] || `Jetski ${num}`;
    }

    function getMachineLabel(machine) {
      if (machine === 'JETSKI') machine = 'JETSKI1';
      if (machine === 'JETSKI1') return machineName(1);
      if (machine === 'JETSKI2') return machineName(2);
      if (machine === 'SPEEDBOAT') return 'Speed Boat';
      return machine || 'Unassigned';
    }

    function isJetskiRide(item) {
      return /jet\s*ski/i.test(item?.name || '');
    }

    function isSpeedboatRide(item) {
      return /speed\s*boat|speedboat/i.test(item?.name || '');
    }

    async function loadAppSettings() {
      const currentFY = getFinancialYear();
      try {
        const saved = await db.settings.get('pos');
        const isNewFormat = Number(saved?.invoiceFormatVersion || 0) >= 3;
        const savedFY = isNewFormat ? String(saved?.invoiceFY || '') : '';
        const next = Number(saved?.nextInvoiceNumber);
        const preset = ['58', '80', '112', 'custom'].includes(String(saved?.receiptPaperPreset)) ? String(saved.receiptPaperPreset) : '80';
        const font = ['small', 'normal', 'large'].includes(String(saved?.receiptFontScale)) ? String(saved.receiptFontScale) : 'normal';
        const autoPrint = ['off', 'ask', 'auto'].includes(String(saved?.autoPrint)) ? String(saved.autoPrint) : 'ask';

        state.settings = {
          ...DEFAULT_SETTINGS,
          invoiceFY: currentFY,
          nextInvoiceNumber: isNewFormat && savedFY === currentFY && Number.isInteger(next) && next > 0 ? next : 1,
          jetskiNames: {
            1: String(saved?.jetskiNames?.[1] || DEFAULT_SETTINGS.jetskiNames[1]).trim() || DEFAULT_SETTINGS.jetskiNames[1],
            2: String(saved?.jetskiNames?.[2] || DEFAULT_SETTINGS.jetskiNames[2]).trim() || DEFAULT_SETTINGS.jetskiNames[2]
          },
          receiptPaperPreset: preset,
          receiptCustomWidth: Math.min(120, Math.max(40, Number(saved?.receiptCustomWidth || 80))),
          receiptFontScale: font,
          showReceiptLogo: saved?.showReceiptLogo !== false,
          autoPrint,
          // Existing installations default to Outdoor High Contrast unless the owner explicitly turns it off.
          outdoorHighContrast: saved?.outdoorHighContrast !== false
        };
      } catch (error) {
        console.warn('Could not load POS settings', error);
        state.settings = { ...structuredClone(DEFAULT_SETTINGS), invoiceFY: currentFY };
      }
      state.settingsLoaded = true;
      applyDisplaySettings();
      await saveAppSettings();
    }

    function applyDisplaySettings() {
      const enabled = state.settings?.outdoorHighContrast !== false;
      document.body.classList.toggle('outdoor-high-contrast', enabled);
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute('content', enabled ? '#F3F4F6' : '#f7f8fa');
    }

    async function saveDisplaySettings() {
      state.settings.outdoorHighContrast = Boolean($('outdoorHighContrast')?.checked);
      await saveAppSettings();
      applyDisplaySettings();
      render();
      showInlineError(state.settings.outdoorHighContrast ? 'Outdoor High Contrast enabled.' : 'Standard light theme enabled.');
    }

    async function saveAppSettings() {
      await db.settings.put({ key: 'pos', ...state.settings });
    }

    async function loadInvoiceSequence() {
      const fy = getFinancialYear();
      if (state.settings.invoiceFY !== fy) {
        state.settings.invoiceFY = fy;
        state.settings.nextInvoiceNumber = 1;
      }
      const all = await db.transactions.toArray();
      state.highestInvoiceNumber = all.reduce((highest, tx) => Math.max(highest, receiptSequence(tx.receiptId, fy)), 0);
      state.settings.nextInvoiceNumber = Math.max(1, Number(state.settings.nextInvoiceNumber || 1), state.highestInvoiceNumber + 1);
      await saveAppSettings();
    }

    function periodBounds(period, anchor = new Date(), explicitFY = null) {
      const a = new Date(anchor);
      if (period === 'today' || period === 'day') {
        const start = startOfDay(a);
        return { start, end: addDays(start, 1) };
      }
      if (period === 'yesterday') {
        const start = addDays(startOfDay(new Date()), -1);
        return { start, end: addDays(start, 1) };
      }
      if (period === 'month') {
        const start = new Date(a.getFullYear(), a.getMonth(), 1);
        const end = new Date(a.getFullYear(), a.getMonth() + 1, 1);
        return { start, end };
      }
      if (period === 'fy') {
        const fy = explicitFY || getFinancialYear(a);
        const start = financialYearStart(fy);
        const end = new Date(start.getFullYear() + 1, 3, 1);
        return { start, end };
      }
      const start = startOfDay(a);
      return { start, end: addDays(start, 1) };
    }

    async function queryByPeriod(table, period, anchor, explicitFY = null) {
      const { start, end } = periodBounds(period, anchor, explicitFY);
      return table.where('timestamp').between(start.toISOString(), end.toISOString(), true, false).reverse().toArray();
    }

    async function loadMenuData() {
      state.menu = await db.menu.toArray();
    }

    async function loadHistoryData() {
      state.history = await queryByPeriod(db.transactions, state.historyPeriod, state.historyAnchor);
    }

    async function loadExpenseData() {
      state.expenses = await queryByPeriod(db.expenses, 'day', state.expenseAnchor);
    }

    async function refreshDailyData() {
      if (state.view === 'history') await loadHistoryData();
      if (state.view === 'expenses') await loadExpenseData();
      await loadDashboardData();
    }

    async function loadDashboardData() {
      const txs = await queryByPeriod(db.transactions, state.reportPeriod, state.reportAnchor);
      const exps = await queryByPeriod(db.expenses, state.reportPeriod, state.reportAnchor);
      const s = emptyStats();

      txs.forEach(tx => {
        if (tx.status === 'VOID') {
          s.voidCount++;
          s.voidAmount += Number(tx.totalAmount || 0);
          return;
        }
        s.completedCount++;
        const amount = Number(tx.totalAmount || 0);
        if (tx.paymentMethod === 'CASH') s.cash += amount;
        if (tx.paymentMethod === 'ONLINE') s.online += amount;
        if (tx.paymentMethod === 'CREDIT') {
          s.credit += amount;
          s.list.push(tx);
        }
      });

      exps.forEach(ex => {
        const amount = Number(ex.amount || 0);
        const method = ex.paymentMethod || 'CASH';
        s.expenseTotal += amount;
        if (method === 'ONLINE') s.onlineExpenseTotal += amount;
        else s.cashExpenseTotal += amount;
      });

      s.grossSales = s.cash + s.online + s.credit;
      s.netCash = s.cash - s.cashExpenseTotal;
      s.netOnline = s.online - s.onlineExpenseTotal;
      s.netCollected = s.cash + s.online - s.expenseTotal;
      state.stats = s;
    }

    async function boot() {
      await loadAppSettings();
      const count = await db.menu.count();
      if (count === 0) {
        await db.menu.bulkAdd([
          { name: 'Jetski', price: 400, isTowable: false },
          { name: 'Speedboat', price: 250, isTowable: false },
          { name: 'Bandwagon', price: 200, isTowable: true },
          { name: 'Sleeper', price: 200, isTowable: true },
          { name: 'Ringo', price: 200, isTowable: true },
          { name: 'Banana', price: 200, isTowable: true },
          { name: 'Double banana', price: 200, isTowable: true }
        ]);
      }
      await loadMenuData();
      await loadInvoiceSequence();
      await loadHistoryData();
      await loadExpenseData();
      render();
    }

    function lineStandardPrice(line) {
      return Math.max(0, Number(line?.item?.price || 0));
    }

    function lineSellingPrice(line) {
      const standard = lineStandardPrice(line);
      const custom = Number(line?.sellingPrice);
      return Number.isFinite(custom) && custom >= 0 ? custom : standard;
    }

    // Subtotal after negotiated Group Rate, before any additional bill discount.
    function getCartSubtotal() {
      return Object.values(state.cart).reduce((sum, c) => sum + lineSellingPrice(c) * Number(c.qty || 0), 0);
    }

    function getCartRegularSubtotal() {
      return Object.values(state.cart).reduce((sum, c) => sum + lineStandardPrice(c) * Number(c.qty || 0), 0);
    }

    function getGroupRateSavings() {
      return Math.max(0, getCartRegularSubtotal() - getCartSubtotal());
    }

    function hasGroupRate() {
      return Object.values(state.cart).some(line => Math.abs(lineSellingPrice(line) - lineStandardPrice(line)) > 0.0001);
    }

    function getAgreedRateForItem(itemId) {
      const lines = Object.values(state.cart).filter(line => Number(line?.item?.id) === Number(itemId));
      if (!lines.length) return null;
      const custom = lines.find(line => Number.isFinite(Number(line.sellingPrice)) && Number(line.sellingPrice) >= 0);
      return custom ? lineSellingPrice(custom) : lineSellingPrice(lines[0]);
    }

    function getCartItemGroups() {
      const groups = new Map();
      Object.values(state.cart).forEach(line => {
        const item = line.item || {};
        const key = String(item.id ?? item.name ?? 'item');
        if (!groups.has(key)) groups.set(key, { item, qty: 0, rate: lineSellingPrice(line) });
        const group = groups.get(key);
        group.qty += Number(line.qty || 0);
        group.rate = lineSellingPrice(line);
      });
      return [...groups.values()];
    }

    function getDiscountAmount() {
      const sub = getCartSubtotal();
      if (state.discount.type === 'fixed') return Math.min(sub, Math.max(0, Number(state.discount.value || 0)));
      if (state.discount.type === 'percent') return Math.round(sub * (Math.min(100, Math.max(0, Number(state.discount.value || 0))) / 100));
      return 0;
    }

    function getCartTotal() {
      return Math.max(0, getCartSubtotal() - getDiscountAmount());
    }

    function getCartQty() {
      return Object.values(state.cart).reduce((sum, c) => sum + Number(c.qty || 0), 0);
    }

    function lineMachine(line) {
      return line.towedBy || line.machineId || null;
    }

    function addCartLine(item, machineId = null) {
      const normalizedMachine = machineId === 'JETSKI' ? 'JETSKI1' : machineId;
      const towedBy = item.isTowable ? normalizedMachine : null;
      const cartKey = `${item.id}_${normalizedMachine || 'NONE'}_${item.isTowable ? 'TOW' : 'DIRECT'}`;
      if (state.cart[cartKey]) {
        state.cart[cartKey].qty += 1;
      } else {
        // If this customer already has a negotiated rate for the same ride,
        // new quantities inherit it even when assigned to another machine.
        const agreedRate = getAgreedRateForItem(item.id);
        state.cart[cartKey] = {
          item,
          qty: 1,
          machineId: normalizedMachine,
          towedBy,
          ...(agreedRate !== null ? { sellingPrice: agreedRate } : {})
        };
      }
      render();
    }

    window.handleTap = menuId => {
      if (state.checkoutLocked) return;
      const item = state.menu.find(m => m.id === menuId);
      if (!item) return;

      if (item.isTowable || isJetskiRide(item)) {
        state.machinePickerItemId = item.id;
        render();
        return;
      }
      if (isSpeedboatRide(item)) {
        addCartLine(item, 'SPEEDBOAT');
        return;
      }
      addCartLine(item, null);
    };

    window.chooseRideMachine = machine => {
      const item = state.menu.find(m => m.id === state.machinePickerItemId);
      if (!item) return;
      const allowed = item.isTowable ? ['JETSKI1', 'JETSKI2', 'SPEEDBOAT'] : ['JETSKI1', 'JETSKI2'];
      if (!allowed.includes(machine)) return;
      state.machinePickerItemId = null;
      addCartLine(item, machine);
    };

    window.closeMachinePicker = () => {
      state.machinePickerItemId = null;
      render();
    };

    window.updateQty = (cartKey, delta) => {
      if (state.checkoutLocked || !state.cart[cartKey]) return;
      state.cart[cartKey].qty += delta;
      if (state.cart[cartKey].qty <= 0) delete state.cart[cartKey];
      if (Object.keys(state.cart).length === 0) state.discount = { type: 'none', value: 0 };
      render();
    };

    window.transferMachine = (cartKey, targetMachine) => {
      if (state.checkoutLocked || !state.cart[cartKey]) return;
      const line = state.cart[cartKey];
      const allowed = line.item.isTowable ? ['JETSKI1', 'JETSKI2', 'SPEEDBOAT'] : (isJetskiRide(line.item) ? ['JETSKI1', 'JETSKI2'] : []);
      if (!allowed.includes(targetMachine) || lineMachine(line) === targetMachine) return;

      const newKey = `${line.item.id}_${targetMachine}_${line.item.isTowable ? 'TOW' : 'DIRECT'}`;
      const moved = { ...line, machineId: targetMachine, towedBy: line.item.isTowable ? targetMachine : null };
      if (state.cart[newKey]) state.cart[newKey].qty += moved.qty;
      else state.cart[newKey] = moved;
      delete state.cart[cartKey];
      renderCartEditor();
    };

    window.toggleCustomerModal = isOpen => { state.customerModalOpen = isOpen; render(); };
    window.toggleCreditModal = isOpen => { state.creditModalOpen = isOpen; render(); };
    window.toggleDiscountModal = isOpen => { state.discountModalOpen = isOpen; render(); };
    window.toggleGroupRateModal = isOpen => {
      state.groupRateModalOpen = !!isOpen;
      if (isOpen) {
        state.groupRateDrafts = {};
        getCartItemGroups().forEach(group => {
          state.groupRateDrafts[String(group.item.id)] = String(
            Number.isFinite(Number(group.rate)) ? Number(group.rate) : Math.max(0, Number(group.item?.price || 0))
          );
        });
      }
      render();
    };
    window.toggleMore = () => { state.moreOpen = !state.moreOpen; render(); };

    function readGroupRateDraft(itemId, fallback) {
      const key = String(itemId);
      const raw = state.groupRateDrafts?.[key];
      if (raw === undefined || raw === null || String(raw).trim() === '') return fallback;
      const n = Number(String(raw).replace(/,/g, '').trim());
      return Number.isFinite(n) && n >= 0 ? n : fallback;
    }

    window.updateGroupRateDraft = (itemId, value) => {
      state.groupRateDrafts[String(itemId)] = value;
      updateGroupRatePreview();
    };

    window.updateGroupRatePreview = () => {
      let regular = 0;
      let packageTotal = 0;
      getCartItemGroups().forEach(group => {
        const standard = Math.max(0, Number(group.item?.price || 0));
        const rate = readGroupRateDraft(group.item.id, group.rate ?? standard);
        regular += standard * Number(group.qty || 0);
        packageTotal += rate * Number(group.qty || 0);
      });
      const saving = regular - packageTotal;
      if ($('groupRateRegularTotal')) $('groupRateRegularTotal').textContent = money(regular);
      if ($('groupRatePackageTotal')) $('groupRatePackageTotal').textContent = money(packageTotal);
      if ($('groupRateSaving')) $('groupRateSaving').textContent = saving >= 0 ? money(saving) : `-${money(Math.abs(saving))}`;
      if ($('groupRateSavingLabel')) $('groupRateSavingLabel').textContent = saving >= 0 ? 'Customer saving' : 'Above regular total';
    };

    window.applyGroupRates = () => {
      const groups = getCartItemGroups();
      if (!groups.length) return;
      const rates = new Map();

      for (const group of groups) {
        const standard = Math.max(0, Number(group.item?.price || 0));
        const raw = String(state.groupRateDrafts?.[String(group.item.id)] ?? '').replace(/,/g, '').trim();
        if (raw === '') {
          showInlineError(`Enter the agreed rate for ${group.item?.name || 'ride'}.`);
          return;
        }
        const value = Number(raw);
        if (!Number.isFinite(value) || value < 0) {
          showInlineError(`Enter a valid rate for ${group.item?.name || 'ride'}.`);
          return;
        }
        // Group Rate is intended for negotiated pricing. We allow any non-negative
        // amount the owner/operator agrees to; this avoids hard-coding a discount cap.
        rates.set(Number(group.item.id), value);
      }

      Object.values(state.cart).forEach(line => {
        const rate = rates.get(Number(line.item?.id));
        if (rate === undefined) return;
        if (Math.abs(rate - lineStandardPrice(line)) < 0.0001) delete line.sellingPrice;
        else line.sellingPrice = rate;
      });

      state.groupRateModalOpen = false;
      state.groupRateDrafts = {};
      scheduleOpenBillAutosave?.();
      render();
      const saving = getCartRegularSubtotal() - getCartSubtotal();
      showInlineError(saving > 0 ? `Group Rate applied. Saving ${money(saving)}.` : 'Group Rate updated.');
    };

    window.clearGroupRates = () => {
      Object.values(state.cart).forEach(line => delete line.sellingPrice);
      state.groupRateModalOpen = false;
      state.groupRateDrafts = {};
      scheduleOpenBillAutosave?.();
      render();
      showInlineError('Group Rate cleared. Regular prices restored.');
    };

    window.saveCustomerInfo = () => {
      state.customer = { name: $('custName')?.value.trim() || '', phone: $('custPhone')?.value.trim() || '' };
      state.customerModalOpen = false;
      render();
    };

    window.applyDiscount = type => {
      const val = parseFloat($('discountInput')?.value) || 0;
      state.discount = val <= 0 ? { type: 'none', value: 0 } : { type, value: type === 'percent' ? Math.min(100, val) : val };
      state.discountModalOpen = false;
      render();
    };

    window.clearDiscount = () => {
      state.discount = { type: 'none', value: 0 };
      state.discountModalOpen = false;
      render();
    };

    function getTransactionMachines(tx) {
      if (Array.isArray(tx.machineUsage) && tx.machineUsage.length) return tx.machineUsage;
      const machines = [];
      if (tx.activeJetskiId) machines.push(`JETSKI${tx.activeJetskiId}`);
      try {
        Object.values(JSON.parse(tx.items || '{}')).forEach(c => {
          const m = c.towedBy || c.machineId;
          if (m) machines.push(m === 'JETSKI' ? 'JETSKI1' : m);
        });
      } catch {}
      return [...new Set(machines)];
    }

    function transactionUsesMachine(tx, filter) {
      return filter === 'ALL' || getTransactionMachines(tx).includes(filter);
    }

    window.processCheckout = async method => {
      if (state.checkoutLocked) return;
      const total = getCartTotal();
      const subtotal = getCartSubtotal();
      if (subtotal <= 0) return;

      let refText = '';
      if (method === 'CREDIT') {
        refText = $('creditInput')?.value.trim() || '';
        if (!refText) {
          showInlineError('Enter hotel, room or customer reference.');
          return;
        }
      }

      state.checkoutLocked = true;
      render();
      const discountAmount = getDiscountAmount();
      const cartSnapshot = JSON.stringify(state.cart);
      const machineUsage = [...new Set(Object.values(state.cart).map(lineMachine).filter(Boolean))];
      const timestamp = new Date().toISOString();
      const fy = getFinancialYear(new Date(timestamp));

      try {
        let invoiceNumber = 0;
        let receiptId = '';
        let txId = null;

        await db.transaction('rw', db.transactions, db.settings, async () => {
          const allTransactions = await db.transactions.toArray();
          const highestStored = allTransactions.reduce((highest, tx) => Math.max(highest, receiptSequence(tx.receiptId, fy)), 0);
          const savedSettings = await db.settings.get('pos');
          const sameFY = Number(savedSettings?.invoiceFormatVersion || 0) >= 3 && savedSettings?.invoiceFY === fy;
          const configuredNext = sameFY ? Number(savedSettings?.nextInvoiceNumber || 1) : 1;
          invoiceNumber = Math.max(1, configuredNext, highestStored + 1);
          receiptId = formatInvoiceId(fy, invoiceNumber);

          txId = await db.transactions.add({
            receiptId,
            financialYear: fy,
            invoiceSequence: invoiceNumber,
            timestamp,
            totalAmount: total,
            discountAmount,
            groupRateSavings: getGroupRateSavings(),
            regularSubtotal: getCartRegularSubtotal(),
            groupSubtotal: getCartSubtotal(),
            paymentMethod: method,
            reference: refText,
            customerName: state.customer.name,
            customerPhone: state.customer.phone,
            items: cartSnapshot,
            machineUsage,
            status: 'COMPLETED'
          });

          await db.settings.put({
            key: 'pos',
            ...state.settings,
            invoiceFormatVersion: 3,
            invoiceFY: fy,
            nextInvoiceNumber: invoiceNumber + 1
          });
        });

        state.highestInvoiceNumber = Math.max(state.highestInvoiceNumber, invoiceNumber);
        state.settings.invoiceFY = fy;
        state.settings.nextInvoiceNumber = invoiceNumber + 1;
        state.cart = {};
        state.customer = { name: '', phone: '' };
        state.discount = { type: 'none', value: 0 };
        state.creditModalOpen = false;
        state.moreOpen = false;
        state.checkoutLocked = false;
        state.successTxId = txId;
        await refreshDailyData();
        render();
        showPaymentSuccess(total, receiptId, method);

        if (state.settings.autoPrint === 'auto') {
          setTimeout(() => printReceiptById(txId, false), 200);
        }
      } catch (error) {
        console.error(error);
        state.checkoutLocked = false;
        render();
        showInlineError('Payment could not be saved. Please try again.');
      }
    };

    function showInlineError(message) {
      const root = $('toast-root');
      if (!root) return;
      root.innerHTML = `<div class="success-toast" style="background:#8b1e16;"><i class="fa-solid fa-circle-exclamation" style="color:#ffd2cd;"></i><span>${escapeHTML(message)}</span></div>`;
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => { if ($('toast-root')) $('toast-root').innerHTML = ''; }, 2400);
    }

    function showPaymentSuccess(total, receiptId, method) {
      const root = $('toast-root');
      if (!root) return;

    function generateReceiptHTML(tx, isKOT = false, forPrint = false) {
      let items = {};
      try { items = JSON.parse(tx.items || '{}'); } catch {}
      const rawLines = Object.values(items);
      const unitPrice = c => {
        const custom = Number(c?.sellingPrice);
        const standard = Math.max(0, Number(c?.item?.price || 0));
        return Number.isFinite(custom) && custom >= 0 ? custom : standard;
      };
      const customerLines = Object.values(rawLines.reduce((groups, c) => {
        const rate = unitPrice(c);
        const key = `${c.item?.id || c.item?.name}_${rate}`;
        if (!groups[key]) groups[key] = { item: c.item, qty: 0, sellingPrice: rate };
        groups[key].qty += Number(c.qty || 0);
        return groups;
      }, {}));
      const displayLines = isKOT ? rawLines : customerLines;
      const scale = receiptScale();
      const width = receiptWidthMM();
      const pxWidth = Math.round(width * 3.78);
      const logo = state.settings.showReceiptLogo ? `<img src="assets/kas.png" class="receipt-logo" alt="Karde Adventure Sports" style="display:block;width:${Math.round(150 * scale)}px;max-width:90%;max-height:${Math.round(58 * scale)}px;height:auto;object-fit:contain;margin:0 auto 5px;">` : '';

      const itemsHtml = displayLines.map(c => {
        const assigned = c.towedBy || c.machineId;
        const rate = unitPrice(c);
        const standard = Math.max(0, Number(c.item?.price || 0));
        const customRate = Math.abs(rate - standard) > 0.0001;
        return `<div style="display:flex;justify-content:space-between;gap:7px;margin-bottom:5px;font-size:${11 * scale}px;line-height:1.25;border-bottom:1px dashed #ccc;padding-bottom:4px;">
          <div style="flex:1;padding-right:4px;"><span style="font-weight:bold;">${escapeHTML(c.qty)}x ${escapeHTML(c.item?.name || 'Item')}</span>${!isKOT ? `<br><span style="font-size:${8.5 * scale}px;">@ ${money(rate)} each${customRate ? ' • Group Rate' : ''}</span>` : ''}${isKOT && assigned ? `<br><span style="font-size:${9 * scale}px;">${c.towedBy ? 'Tow' : 'Machine'}: ${escapeHTML(getMachineLabel(assigned))}</span>` : ''}</div>
          ${!isKOT ? `<div style="font-weight:bold;text-align:right;min-width:48px;">${money(rate * Number(c.qty || 0))}</div>` : ''}
        </div>`;
      }).join('');

      const regularSubtotal = rawLines.reduce((sum, c) => sum + Math.max(0, Number(c.item?.price || 0)) * Number(c.qty || 0), 0);
      const groupSubtotal = rawLines.reduce((sum, c) => sum + unitPrice(c) * Number(c.qty || 0), 0);
      const groupRateSavings = Math.max(0, regularSubtotal - groupSubtotal);
      return `<div class="receipt-container" id="printable-receipt" style="width:${forPrint ? width + 'mm' : Math.min(pxWidth, 420) + 'px'};max-width:100%;margin:0 auto;background:#fff;padding:${Math.max(8, 12 * scale)}px;font-family:'Courier New',Courier,monospace;color:#000;box-sizing:border-box;">
        <div style="text-align:center;padding-bottom:8px;border-bottom:2px solid #000;">
          ${logo}
          <div style="font-size:${11 * scale}px;font-weight:900;line-height:1.2;text-transform:uppercase;">Karde Adventure Sports</div>
          <div style="font-size:${8 * scale}px;margin-top:2px;letter-spacing:.04em;">${isKOT ? 'RIDE KOT TICKET' : 'WATERSPORTS BILL'}</div>
          <div style="font-size:${9 * scale}px;margin-top:5px;font-weight:bold;">${escapeHTML(tx.receiptId)}</div>
          <div style="font-size:${9 * scale}px;">${escapeHTML(new Date(tx.timestamp).toLocaleString('en-IN'))}</div>
          ${isKOT && getTransactionMachines(tx).length ? `<div style="font-size:${9 * scale}px;margin-top:3px;font-weight:bold;">Machine: ${escapeHTML(getTransactionMachines(tx).map(getMachineLabel).join(' + '))}</div>` : ''}
        </div>
        ${(tx.customerName || tx.customerPhone) ? `<div style="margin:8px 0;font-size:${10 * scale}px;border-bottom:1px dotted #000;padding-bottom:6px;">${tx.customerName ? `<div><strong>Customer:</strong> ${escapeHTML(tx.customerName)}</div>` : ''}${tx.customerPhone ? `<div><strong>Phone:</strong> ${escapeHTML(tx.customerPhone)}</div>` : ''}</div>` : ''}
        <div style="margin-top:9px;">${itemsHtml}</div>
        ${!isKOT ? `<div style="border-top:1px dashed #000;margin:8px 0;"></div>
          ${groupRateSavings > 0 ? `<div style="display:flex;justify-content:space-between;gap:8px;font-size:${10 * scale}px;line-height:1.25;margin-bottom:4px;"><span>Regular total</span><span>${money(regularSubtotal)}</span></div><div style="display:flex;justify-content:space-between;gap:8px;font-size:${10 * scale}px;line-height:1.25;margin-bottom:4px;"><span>Group Rate saving</span><span>-${money(groupRateSavings)}</span></div>` : ''}
          <div style="display:flex;justify-content:space-between;gap:8px;font-size:${10 * scale}px;line-height:1.25;margin-bottom:4px;"><span>${groupRateSavings > 0 ? 'Group subtotal' : 'Subtotal'}</span><span>${money(groupSubtotal)}</span></div>
          ${Number(tx.discountAmount) > 0 ? `<div style="display:flex;justify-content:space-between;gap:8px;font-size:${10 * scale}px;line-height:1.25;margin-bottom:4px;"><span>Additional discount</span><span>-${money(tx.discountAmount)}</span></div>` : ''}
          <div style="border-top:2px solid #000;border-bottom:2px solid #000;padding:6px 0;margin-top:5px;display:flex;justify-content:space-between;font-size:${15 * scale}px;font-weight:bold;"><span>TOTAL</span><span>${money(tx.totalAmount)}</span></div>
          <div style="font-size:${9 * scale}px;text-align:right;margin-top:5px;font-weight:bold;">Payment: ${escapeHTML(tx.paymentMethod)}</div>` : `<div style="border-top:2px solid #000;padding-top:6px;text-align:center;font-size:${11 * scale}px;font-weight:bold;">OPERATOR COPY</div>`}
        ${tx.reference ? `<div style="text-align:center;font-size:${9 * scale}px;margin-top:8px;padding:4px;border:1px dashed #000;">Ref: ${escapeHTML(tx.reference)}</div>` : ''}
        <div style="border-top:1px dashed #000;margin-top:10px;padding-top:7px;text-align:center;font-size:${9 * scale}px;">Thank you for visiting<br><strong>Karde Adventure Sports</strong></div>
      </div>`;
    }

    window.triggerDownload = async isKOT => {
      const tx = await getTxById(state.previewTxId);

      const holder = document.createElement('div');

        const width = receiptWidthMM();
        const estimatedHeight = Math.max(80, Math.ceil(element.scrollHeight * 0.264583 + 8));

          filename: `${isKOT ? 'KOT' : 'Bill'}_${safeId}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 3, useCORS: true, allowTaint: false, logging: false },
          jsPDF: { unit: 'mm', format: [width, estimatedHeight], orientation: 'portrait' }

        console.error(error);
        showInlineError('Could not generate the receipt PDF.');

        holder.remove();

</style></head><body>${html}</body></html>`);

      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });

      const a = document.createElement('a');

    window.importBackup = async input => {
      const file = input?.files?.[0];
      if (!file) return;
      if (!confirm('Restore this backup? Current local POS data will be replaced.')) { input.value = ''; return; }
      try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data.transactions) || !Array.isArray(data.expenses) || !Array.isArray(data.menu)) throw new Error('Invalid backup');
        await db.transaction('rw', db.transactions, db.expenses, db.menu, db.settings, async () => {
          await Promise.all([db.transactions.clear(), db.expenses.clear(), db.menu.clear(), db.settings.clear()]);
          if (data.transactions.length) await db.transactions.bulkAdd(data.transactions);
          if (data.expenses.length) await db.expenses.bulkAdd(data.expenses);
          if (data.menu.length) await db.menu.bulkAdd(data.menu);
          if (Array.isArray(data.settings) && data.settings.length) await db.settings.bulkPut(data.settings);
        });
        await loadAppSettings();
        await loadInvoiceSequence();
        await loadMenuData();
        await loadHistoryData();
        await loadExpenseData();
        render();
        showInlineError('Backup restored successfully.');
      } catch (error) {
        console.error(error);
        showInlineError('Invalid or unreadable backup file.');

        input.value = '';

    function renderPOS() {
      const cartQty = getCartQty();
      return `${renderHeader()}
        <div class="surface" style="padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:9px;background:#f4f8ff;border-color:#cfe0f7;">
          <i class="fa-solid fa-circle-info" style="color:#1769d1;"></i>
          <div style="font-size:10px;line-height:1.35;color:#4b5c70;font-weight:750;"><strong>Machine assignment is now per ride.</strong> Tap a Jetski/towed ride and choose the exact machine. Speedboat is assigned automatically.</div>
        </div>
        <div class="section-title-row"><span class="section-title">Select ride</span><span class="section-hint">${cartQty ? `${cartQty} selected` : 'Tap to add'}</span></div>
        <section class="ride-grid">${state.menu.map(item => {
          const matchingKeys = Object.keys(state.cart).filter(key => state.cart[key].item.id === item.id);
          const qty = matchingKeys.reduce((sum, key) => sum + state.cart[key].qty, 0);
          const selected = qty > 0;
          const singleKey = matchingKeys.length === 1 ? matchingKeys[0] : null;
          const machineHint = item.isTowable ? 'Choose tow machine' : (isJetskiRide(item) ? 'Choose Jetski' : (isSpeedboatRide(item) ? 'Speed Boat' : 'Direct ride'));
          return `<div class="ride-button ${selected ? 'selected' : ''}" role="button" tabindex="0" onclick="handleTap(${item.id})">
            ${item.isTowable ? `<span class="tow-icon"><i class="fa-solid fa-link"></i></span>` : ''}
            <span class="ride-name">${escapeHTML(item.name)}</span><span class="ride-price">${money(item.price)}</span>
            <span style="display:block;margin-top:7px;font-size:8px;color:#7b8490;font-weight:850;">${escapeHTML(machineHint)}</span>
            ${selected && singleKey ? `<span class="ride-qty-control" onclick="event.stopPropagation();"><button class="qty-mini" onclick="event.stopPropagation();updateQty('${escapeHTML(singleKey)}',-1)">−</button><span class="qty-number">${qty}</span><button class="qty-mini" onclick="event.stopPropagation();updateQty('${escapeHTML(singleKey)}',1)">+</button></span>` : ''}
            ${selected && !singleKey ? `<button onclick="event.stopPropagation();renderCartEditor()" style="position:absolute;right:8px;top:8px;border:2px solid #fff;border-radius:8px;background:#1769d1;color:#fff;padding:6px 8px;font-size:9px;font-weight:950;box-shadow:0 2px 8px rgba(23,105,209,.28);">${qty} • SPLIT</button>` : ''}
          </div>`;
        }).join('')}</section>
        ${cartQty === 0 ? `<div class="empty-order">Select a ride to start billing.</div>` : ''}`;
    }

    function renderCheckoutDock() {
      if (state.view !== 'pos') return '';
      const cartItems = Object.entries(state.cart);
      const subtotal = getCartSubtotal();
      const discountAmt = getDiscountAmount();
      const total = getCartTotal();
      const cartQty = getCartQty();
      if (!cartItems.length) return `<div class="empty-checkout"><div class="empty-checkout-text"><strong>Ready for next customer</strong><span>Choose a ride to start billing</span></div><div class="empty-checkout-total">₹0</div></div>`;
      const orderText = cartItems.map(([, data]) => `${data.qty}× ${data.item.name}${lineMachine(data) ? ` • ${getMachineLabel(lineMachine(data))}` : ''}`).join('  |  ');
      return `<div class="checkout-panel"><div class="checkout-top"><div class="order-preview"><span class="order-count">${cartQty} ${cartQty === 1 ? 'RIDE' : 'RIDES'}</span><span class="order-items-text">${escapeHTML(orderText)}</span></div><div class="total-box"><span class="total-label">${discountAmt ? `Saved ${money(discountAmt)}` : 'Total'}</span>${discountAmt ? `<span style="display:block;color:#9ca3af;font-size:9px;text-decoration:line-through;">${money(subtotal)}</span>` : ''}<span class="total-value">${money(total)}</span></div></div>
        <div class="more-row"><button onclick="toggleMore()" class="more-button"><i class="fa-solid fa-ellipsis"></i> ${state.moreOpen ? 'Hide' : 'More'}</button></div>
        <div class="checkout-actions ${state.moreOpen ? '' : 'collapsed'}"><button onclick="toggleCustomerModal(true)" class="secondary-action ${state.customer.name || state.customer.phone ? 'has-value' : ''}"><i class="fa-solid fa-user"></i> ${state.customer.name ? escapeHTML(state.customer.name.substring(0, 12)) : 'Customer'}</button><button onclick="toggleDiscountModal(true)" class="secondary-action ${discountAmt > 0 ? 'has-value' : ''}"><i class="fa-solid fa-tag"></i> ${discountAmt ? `-${money(discountAmt)}` : 'Discount'}</button><button onclick="renderCartEditor()" class="secondary-action" style="margin-left:auto;"><i class="fa-solid fa-list-check"></i> Order</button></div>
        <div class="payment-grid"><button onclick="processCheckout('CASH')" class="pay-button pay-cash" ${state.checkoutLocked ? 'disabled' : ''}><i class="fa-solid fa-money-bill-wave"></i> CASH</button><button onclick="processCheckout('ONLINE')" class="pay-button pay-online" ${state.checkoutLocked ? 'disabled' : ''}><i class="fa-solid fa-qrcode"></i> ONLINE</button><button onclick="toggleCreditModal(true)" class="pay-button pay-credit" ${state.checkoutLocked ? 'disabled' : ''}><i class="fa-solid fa-hotel"></i> CREDIT</button></div></div>`;
    }

    window.renderCartEditor = () => {
      const items = Object.entries(state.cart);
      $('modals').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeCartEditor()"><div class="modal-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div><div style="font-size:17px;font-weight:950;">Current Order</div><div style="font-size:10px;color:#858d96;font-weight:700;margin-top:2px;">Quantity and exact machine assignment</div></div><button onclick="closeCartEditor()" class="neutral-btn" style="min-height:34px;padding:0 11px;">Close</button></div>
        ${items.map(([key, data]) => {
          const assigned = lineMachine(data);
          const editableMachine = data.item.isTowable || isJetskiRide(data.item);
          const options = data.item.isTowable ? ['JETSKI1', 'JETSKI2', 'SPEEDBOAT'] : ['JETSKI1', 'JETSKI2'];
          return `<div class="surface" style="padding:10px;margin-bottom:7px;"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;"><div style="min-width:0;flex:1;"><div style="font-size:13px;font-weight:950;">${escapeHTML(data.item.name)}</div><div style="font-size:10px;color:#1769d1;font-weight:800;margin-top:3px;">${data.item.isTowable ? 'Tow' : 'Machine'}: ${escapeHTML(getMachineLabel(assigned))}</div>${editableMachine ? `<div class="tow-transfer"><span class="tow-transfer-label">Change:</span>${options.map(m => `<button onclick="transferMachine('${escapeHTML(key)}','${m}')" class="${assigned === m ? 'active' : ''}">${escapeHTML(getMachineLabel(m))}</button>`).join('')}</div>` : ''}</div><div style="display:flex;align-items:center;gap:7px;"><button onclick="updateQty('${escapeHTML(key)}',-1);renderCartEditor()" class="neutral-btn" style="width:34px;min-height:34px;padding:0;font-size:18px;">−</button><strong style="min-width:18px;text-align:center;">${data.qty}</strong><button onclick="updateQty('${escapeHTML(key)}',1);renderCartEditor()" class="primary-btn" style="width:34px;min-height:34px;padding:0;font-size:18px;">+</button></div></div></div>`;
        }).join('')}
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e1e5e9;padding-top:12px;margin-top:10px;"><strong>Total</strong><strong style="font-size:22px;color:#14763b;">${money(getCartTotal())}</strong></div></div></div>`;
    };
    window.closeCartEditor = () => render();

    function filteredHistory() {
      const q = state.historySearch.toLowerCase();
      return state.history.filter(tx => {
        const machineOk = transactionUsesMachine(tx, state.historyMachineFilter);
        const paymentOk = state.historyPaymentFilter === 'ALL' || (state.historyPaymentFilter === 'VOID' ? tx.status === 'VOID' : tx.status !== 'VOID' && tx.paymentMethod === state.historyPaymentFilter);
        const searchOk = !q || [tx.receiptId, tx.customerName, tx.customerPhone, tx.reference].some(v => String(v || '').toLowerCase().includes(q));
        return machineOk && paymentOk && searchOk;
      });
    }

    function renderHistory() {
      const filtered = filteredHistory();
      const visibleTotal = filtered.filter(t => t.status !== 'VOID').reduce((s, t) => s + Number(t.totalAmount || 0), 0);
      return `${renderHeader()}<div class="screen-heading"><div><h2>Bill History</h2><p>${periodLabel(state.historyPeriod, state.historyAnchor)} • ${filtered.length} shown</p></div><div style="font-size:18px;font-weight:950;color:#14763b;">${money(visibleTotal)}</div></div>
        <div class="period-tabs"><button onclick="setHistoryPeriod('today')" class="history-filter ${state.historyPeriod === 'today' ? 'active' : ''}">TODAY</button><button onclick="setHistoryPeriod('yesterday')" class="history-filter ${state.historyPeriod === 'yesterday' ? 'active' : ''}">YESTERDAY</button><button onclick="setHistoryPeriod('month')" class="history-filter ${state.historyPeriod === 'month' ? 'active' : ''}">MONTH</button><button onclick="setHistoryPeriod('fy')" class="history-filter ${state.historyPeriod === 'fy' ? 'active' : ''}">FY</button><button onclick="setHistoryPeriod('custom')" class="history-filter ${state.historyPeriod === 'custom' ? 'active' : ''}">DATE</button></div>
        ${historyDateControl() ? `<div style="margin-bottom:9px;">${historyDateControl()}</div>` : ''}
        <div style="display:flex;gap:6px;margin-bottom:8px;"><input id="historySearch" class="form-input" value="${escapeHTML(state.historySearch)}" placeholder="Invoice / customer / phone" style="min-height:39px;font-size:12px;" onkeydown="if(event.key==='Enter')applyHistorySearch()"><button onclick="applyHistorySearch()" class="primary-btn" style="min-height:39px;padding:0 12px;"><i class="fa-solid fa-magnifying-glass"></i></button>${state.historySearch ? `<button onclick="clearHistorySearch()" class="neutral-btn" style="min-height:39px;padding:0 10px;">Clear</button>` : ''}</div>
        <div class="history-filters"><button onclick="setHistoryMachineFilter('ALL')" class="history-filter ${state.historyMachineFilter === 'ALL' ? 'active' : ''}">ALL</button><button onclick="setHistoryMachineFilter('JETSKI1')" class="history-filter ${state.historyMachineFilter === 'JETSKI1' ? 'active' : ''}">${escapeHTML(machineName(1))}</button><button onclick="setHistoryMachineFilter('JETSKI2')" class="history-filter ${state.historyMachineFilter === 'JETSKI2' ? 'active' : ''}">${escapeHTML(machineName(2))}</button><button onclick="setHistoryMachineFilter('SPEEDBOAT')" class="history-filter ${state.historyMachineFilter === 'SPEEDBOAT' ? 'active' : ''}">BOAT</button></div>
        <div class="period-tabs" style="grid-template-columns:repeat(5,1fr);margin-bottom:10px;"><button onclick="setHistoryPaymentFilter('ALL')" class="history-filter ${state.historyPaymentFilter === 'ALL' ? 'active' : ''}">ALL</button><button onclick="setHistoryPaymentFilter('CASH')" class="history-filter ${state.historyPaymentFilter === 'CASH' ? 'active' : ''}">CASH</button><button onclick="setHistoryPaymentFilter('ONLINE')" class="history-filter ${state.historyPaymentFilter === 'ONLINE' ? 'active' : ''}">UPI</button><button onclick="setHistoryPaymentFilter('CREDIT')" class="history-filter ${state.historyPaymentFilter === 'CREDIT' ? 'active' : ''}">CREDIT</button><button onclick="setHistoryPaymentFilter('VOID')" class="history-filter ${state.historyPaymentFilter === 'VOID' ? 'active' : ''}">VOID</button></div>
        <div class="surface" style="overflow:hidden;margin-bottom:16px;">${filtered.length === 0 ? `<div style="padding:28px 15px;text-align:center;color:#7e8791;font-size:12px;font-weight:700;">No bills found for this selection.</div>` : filtered.map((tx, index) => {
          let itemsStr = ''; try { itemsStr = Object.values(JSON.parse(tx.items || '{}')).map(c => `${c.qty}× ${c.item?.name || 'Item'}`).join(' • '); } catch { itemsStr = 'Items unavailable'; }
          const machines = getTransactionMachines(tx);
          return `<div style="padding:11px;border-bottom:1px solid #e4e7ea;${tx.status === 'VOID' ? 'background:#fff5f5;opacity:.78;' : ''}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start;"><div style="min-width:0;flex:1;"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><strong style="font-size:16px;">${money(tx.totalAmount)}</strong><span style="font-size:8px;font-weight:900;padding:4px 6px;border-radius:5px;background:#f0f1f3;color:#5c6570;border:1px solid #dfe2e5;">${escapeHTML(tx.paymentMethod)}</span>${tx.status === 'VOID' ? `<span style="font-size:8px;font-weight:900;color:#b42318;background:#fee4e2;padding:4px 6px;border-radius:5px;">VOID</span>` : ''}</div><div style="font-size:9px;color:#858d96;font-weight:700;margin-top:3px;">${escapeHTML(tx.receiptId)} • ${escapeHTML(new Date(tx.timestamp).toLocaleString('en-IN'))}</div><div style="font-size:10px;color:#3f4852;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHTML(itemsStr)}</div><div class="machine-tags">${machines.map(m => `<span class="machine-tag">${escapeHTML(getMachineLabel(m))}</span>`).join('')}</div>${tx.customerName ? `<div style="font-size:9px;color:#1769d1;font-weight:800;margin-top:3px;"><i class="fa-solid fa-user"></i> ${escapeHTML(tx.customerName)}</div>` : ''}</div>${tx.status === 'COMPLETED' && index === 0 && state.historyPeriod === 'today' ? `<button onclick="voidTransaction(${tx.id})" class="danger-btn" style="min-height:32px;padding:0 9px;font-size:9px;">VOID</button>` : ''}</div>${tx.status === 'COMPLETED' ? `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;"><button onclick="openPreview(${tx.id},false)" class="neutral-btn" style="min-height:34px;"><i class="fa-solid fa-file-invoice"></i> Bill</button><button onclick="openPreview(${tx.id},true)" class="neutral-btn" style="min-height:34px;"><i class="fa-solid fa-ticket"></i> KOT</button><button onclick="printReceiptById(${tx.id},false)" class="neutral-btn" style="min-height:34px;"><i class="fa-solid fa-print"></i> Print</button></div>` : ''}</div>`;
        }).join('')}</div>`;
    }

    function renderExpenses() {
      const cashExpense = state.expenses.filter(ex => (ex.paymentMethod || 'CASH') === 'CASH').reduce((s, ex) => s + Number(ex.amount || 0), 0);
      const onlineExpense = state.expenses.filter(ex => ex.paymentMethod === 'ONLINE').reduce((s, ex) => s + Number(ex.amount || 0), 0);
      return `${renderHeader()}<div class="screen-heading"><div><h2>Expenses</h2><p>Record and review daily expenses</p></div></div>
        <div class="surface" style="padding:12px;margin-bottom:12px;"><input id="expDesc" type="text" placeholder="Expense reason (e.g. Fuel)" class="form-input" style="margin-bottom:7px;"><input id="expAmt" type="number" inputmode="decimal" placeholder="Amount (₹)" class="form-input" style="margin-bottom:8px;font-weight:900;"><div class="expense-methods"><button onclick="setExpensePaymentMethod('CASH')" class="expense-method ${state.expensePaymentMethod === 'CASH' ? 'active' : ''}"><i class="fa-solid fa-money-bill-wave"></i> CASH</button><button onclick="setExpensePaymentMethod('ONLINE')" class="expense-method ${state.expensePaymentMethod === 'ONLINE' ? 'active' : ''}"><i class="fa-solid fa-qrcode"></i> UPI</button></div><button onclick="addExpense()" class="danger-btn" style="width:100%;">Add ${state.expensePaymentMethod === 'ONLINE' ? 'UPI' : 'Cash'} Expense</button></div>
        <div class="surface" style="padding:9px;margin-bottom:10px;"><label style="display:block;font-size:9px;font-weight:900;color:#6c7580;margin-bottom:5px;text-transform:uppercase;">View expenses for</label><input type="date" class="form-input compact-filter-input" value="${localDateKey(state.expenseAnchor)}" onchange="setExpenseDate(this.value)"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px;"><div class="surface" style="padding:9px;text-align:center;"><div style="font-size:8px;font-weight:900;text-transform:uppercase;color:#68717c;">Cash</div><div style="font-size:16px;font-weight:950;color:#c5261b;margin-top:3px;">${money(cashExpense)}</div></div><div class="surface" style="padding:9px;text-align:center;"><div style="font-size:8px;font-weight:900;text-transform:uppercase;color:#1769d1;">UPI</div><div style="font-size:16px;font-weight:950;color:#1769d1;margin-top:3px;">${money(onlineExpense)}</div></div><div class="surface" style="padding:9px;text-align:center;"><div style="font-size:8px;font-weight:900;text-transform:uppercase;color:#68717c;">Total</div><div style="font-size:16px;font-weight:950;color:#c5261b;margin-top:3px;">${money(cashExpense + onlineExpense)}</div></div></div>
        <div class="surface" style="overflow:hidden;margin-bottom:16px;">${state.expenses.length === 0 ? `<div style="padding:26px;text-align:center;color:#818993;font-size:11px;font-weight:700;">No expenses logged for this date.</div>` : state.expenses.map(ex => `<div style="padding:11px;border-bottom:1px solid #e4e7ea;display:flex;justify-content:space-between;align-items:center;gap:10px;"><div style="min-width:0;"><span style="display:block;font-size:12px;font-weight:850;">${escapeHTML(ex.description)}</span><span style="display:block;margin-top:3px;font-size:8px;color:#7c858f;font-weight:800;">${escapeHTML(ex.paymentMethod === 'ONLINE' ? 'UPI' : 'CASH')} • ${escapeHTML(new Date(ex.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</span></div><span style="font-size:11px;font-weight:950;color:#c5261b;">-${money(ex.amount)}</span></div>`).join('')}</div>`;
    }

    function renderDashboard() {
      const s = state.stats;
      return `${renderHeader()}<div class="screen-heading"><div><h2>Sales & EOD</h2><p>${periodLabel(state.reportPeriod, state.reportAnchor)} summary</p></div></div>
        <div class="period-tabs" style="grid-template-columns:repeat(3,1fr);"><button onclick="setReportPeriod('day')" class="history-filter ${state.reportPeriod === 'day' ? 'active' : ''}">DAY</button><button onclick="setReportPeriod('month')" class="history-filter ${state.reportPeriod === 'month' ? 'active' : ''}">MONTH</button><button onclick="setReportPeriod('fy')" class="history-filter ${state.reportPeriod === 'fy' ? 'active' : ''}">FINANCIAL YEAR</button></div><div style="margin:8px 0 10px;">${reportDateControl()}</div>
        <div class="surface" style="padding:13px;margin-bottom:10px;"><div class="settings-section-title">Sales</div>${[['Cash Sales',s.cash],['UPI Sales',s.online],['Credit Sales',s.credit]].map(([label,val]) => `<div style="display:flex;justify-content:space-between;margin-bottom:9px;font-size:12px;font-weight:800;"><span style="color:#68717c;">${label}</span><span>${money(val)}</span></div>`).join('')}<div style="display:flex;justify-content:space-between;align-items:center;background:#f0f6ff;border:1px solid #cfe0f7;border-radius:8px;padding:10px;"><span style="font-size:10px;font-weight:900;text-transform:uppercase;color:#1559a8;">Gross Sales</span><span style="font-size:23px;font-weight:950;color:#1769d1;">${money(s.grossSales)}</span></div></div>
        <div class="surface" style="padding:13px;margin-bottom:10px;"><div class="settings-section-title">Expenses</div><div style="display:flex;justify-content:space-between;margin-bottom:9px;font-size:12px;font-weight:800;"><span style="color:#68717c;">Cash Expenses</span><span style="color:#c5261b;">-${money(s.cashExpenseTotal)}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:9px;font-size:12px;font-weight:800;"><span style="color:#68717c;">UPI Expenses</span><span style="color:#c5261b;">-${money(s.onlineExpenseTotal)}</span></div><div style="display:flex;justify-content:space-between;border-top:1px solid #eee;padding-top:9px;font-size:12px;font-weight:950;"><span>Total Expenses</span><span style="color:#c5261b;">-${money(s.expenseTotal)}</span></div></div>
        <div class="surface" style="padding:13px;margin-bottom:10px;"><div class="settings-section-title">Net Collection</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;"><div style="background:#eaf7ef;border:1px solid #c5e7d0;border-radius:8px;padding:10px;text-align:center;"><div style="font-size:8px;font-weight:900;color:#126d37;text-transform:uppercase;">Net Cash</div><div style="font-size:18px;font-weight:950;color:#14763b;margin-top:3px;">${money(s.netCash)}</div></div><div style="background:#edf5ff;border:1px solid #cfe0f7;border-radius:8px;padding:10px;text-align:center;"><div style="font-size:8px;font-weight:900;color:#1559a8;text-transform:uppercase;">Net UPI</div><div style="font-size:18px;font-weight:950;color:#1769d1;margin-top:3px;">${money(s.netOnline)}</div></div></div><div style="display:flex;justify-content:space-between;align-items:center;background:#17231b;color:#fff;border-radius:8px;padding:11px;"><span style="font-size:10px;font-weight:900;text-transform:uppercase;">Collected after expenses</span><span style="font-size:22px;font-weight:950;">${money(s.netCollected)}</span></div></div>
        <div class="surface" style="padding:13px;margin-bottom:16px;"><div class="settings-section-title">Attention</div><div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span style="font-size:11px;font-weight:800;">Pending Credit</span><strong style="color:#b42318;">${money(s.credit)}</strong></div><div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span style="font-size:11px;font-weight:800;">Completed Bills</span><strong>${s.completedCount}</strong></div><div style="display:flex;justify-content:space-between;"><span style="font-size:11px;font-weight:800;">Voided Tickets</span><strong style="color:#b42318;">${s.voidCount} • ${money(s.voidAmount)}</strong></div></div>`;
    }

    function renderSettings() {
      const editingItem = state.editingRideId ? state.menu.find(m => m.id === state.editingRideId) : null;
      const fy = getFinancialYear();
      return `${renderHeader()}<div class="screen-heading"><div><h2>Setup</h2><p>Display, billing, machines, printing, backup and ride menu</p></div></div>

ct><label style="display:flex;align-items:center;gap:9px;background:#f5f6f7;border:1px solid #e0e3e6;border-radius:7px;padding:10px;"><input id="showReceiptLogo" type="checkbox" ${state.settings.showReceiptLogo ? 'checked' : ''} style="width:19px;height:19px;accent-color:#1769d1;"><span style="font-size:11px;font-weight:850;">Show KAS logo on receipts</span></label><div class="settings-hint">Use your operating system's installed USB/LAN/Bluetooth thermal printer. The print layout uses the selected roll width.</div><button onclick="savePrinterSettings()" class="primary-btn" style="width:100%;margin-top:10px;"><i class="fa-solid fa-print"></i> Save Printer Settings</button></div>

      if (state.groupRateModalOpen) {

          }).join('')}</div>
          <div class="group-rate-summary">

    function updateFooterHeight() {
      requestAnimationFrame(() => {
        const footer = $('pos-footer');
        if (footer) document.documentElement.style.setProperty('--footer-height', `${footer.offsetHeight}px`);
      });
