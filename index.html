<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>KAS POS — Karde Adventure Sports</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --kas-blue: #1769d1;
      --kas-green: #159447;
      --kas-yellow: #f0b900;
      --page-bg: #f5f7f9;
      --footer-height: 72px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      user-select: none;
      touch-action: manipulation;
      color: #17202a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: calc(var(--footer-height) + env(safe-area-inset-bottom, 0px));
    }

    input, textarea, select {
      user-select: text;
      touch-action: auto;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(.985);
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 12px 16px;
    }

    .compact-header {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #dfe3e7;
      margin-bottom: 10px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
    }

    .brand-mini img {
      width: 54px;
      height: 42px;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      line-height: 1.05;
      min-width: 0;
    }

    .brand-title strong {
      display: block;
      font-size: 13px;
      letter-spacing: .02em;
    }

    .brand-title span {
      display: block;
      margin-top: 3px;
      color: #737b85;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .active-machine-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      background: #eaf7ef;
      border: 1px solid #bce4c9;
      color: #11783b;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #16a34a;
      border-radius: 50%;
      display: inline-block;
    }

    .control-strip {
      background: #fff;
      border: 1px solid #d8dde3;
      border-radius: 10px;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 8px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .control-label {
      color: #69727d;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .segmented {
      display: flex;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .segmented button {
      min-height: 38px;
      flex: 1;
      border: 1px solid #d2d7dd;
      border-radius: 7px;
      background: #f4f5f7;
      color: #3d4651;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .segmented button.active-machine {
      background: #159447;
      border-color: #159447;
      color: #fff;
    }

    .segmented button.active-tow {
      background: #1769d1;
      border-color: #1769d1;
      color: #fff;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 2px 8px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #6c7580;
    }

    .section-hint {
      font-size: 10px;
      font-weight: 700;
      color: #9aa1a9;
    }

    .ride-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .ride-button {
      min-height: 104px;
      position: relative;
      overflow: hidden;
      background: #fff;
      border: 1px solid #d7dce2;
      border-radius: 10px;
      padding: 13px 10px;
      padding-right: 86px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.035);
      transition: border-color .12s, background .12s, transform .06s;
    }

    .ride-button.selected {
      background: #f5f9ff;
      border-color: #6fa5e5;
      box-shadow: 0 0 0 1px rgba(37,99,235,.08);
    }

    .ride-button:active {
      background: #edf5ff;
      border-color: #8db8ed;
    }

    .ride-name {
      display: block;
      padding-right: 28px;
      font-size: 15px;
      line-height: 1.15;
      font-weight: 900;
      color: #141b23;
    }

    .ride-price {
      display: block;
      margin-top: 8px;
      color: #1769d1;
      font-size: 14px;
      font-weight: 900;
    }

    .tow-icon {
      position: absolute;
      bottom: 10px;
      right: 10px;
      color: #9aa2aa;
      font-size: 11px;
    }

    .ride-qty-control {
      position: absolute;
      right: 8px;
      top: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
      background: #1769d1;
      border: 2px solid #fff;
      border-radius: 9px;
      padding: 3px;
      box-shadow: 0 2px 8px rgba(23,105,209,.28);
      z-index: 5;
    }

    .qty-mini {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #1769d1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .qty-number {
      min-width: 24px;
      text-align: center;
      color: #fff;
      font-size: 12px;
      font-weight: 950;
    }

    .empty-order {
      margin-top: 10px;
      border: 1px dashed #cbd2d9;
      border-radius: 9px;
      padding: 10px;
      text-align: center;
      color: #8a929b;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255,255,255,.55);
    }

    #pos-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: rgba(255,255,255,.98);
      border-top: 1px solid #cfd5db;
      box-shadow: 0 -5px 18px rgba(0,0,0,.09);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #checkout-dock {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .checkout-panel {
      padding: 8px 12px 9px;
      border-bottom: 1px solid #e1e5e9;
    }

    .checkout-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
    }

    .order-preview {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .order-count {
      flex-shrink: 0;
      background: #eef2f6;
      color: #56606b;
      border: 1px solid #dce1e6;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 10px;
      font-weight: 900;
    }

    .order-items-text {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 11px;
      color: #3f4852;
      font-weight: 800;
    }

    .total-box {
      text-align: right;
      white-space: nowrap;
    }

    .total-label {
      display: block;
      color: #7a838d;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .total-value {
      display: block;
      color: #14763b;
      font-size: 23px;
      line-height: 1;
      font-weight: 950;
    }

    .checkout-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 7px;
    }

    .checkout-actions.collapsed {
      display: none;
    }

    .more-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }

    .more-button {
      min-height: 28px;
      border: 1px solid #d5dbe1;
      background: #fff;
      color: #59636e;
      border-radius: 6px;
      padding: 0 9px;
      font-size: 10px;
      font-weight: 900;
    }

    .secondary-action {
      min-height: 31px;
      border: 1px solid #d5dbe1;
      background: #f4f5f7;
      color: #4d5660;
      border-radius: 6px;
      padding: 0 9px;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .secondary-action.has-value {
      background: #edf5ff;
      border-color: #b8d4f6;
      color: #1559a8;
    }

    .payment-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .pay-button {
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      font-weight: 950;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.10);
      cursor: pointer;
    }

    .pay-button i { font-size: 15px; }

    .pay-button:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none !important;
    }

    #toast-root {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--footer-height) + 8px);
      z-index: 80;
      display: flex;
      justify-content: center;
      pointer-events: none;
      padding: 0 12px;
    }

    .success-toast {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #17231b;
      color: #fff;
      border-radius: 999px;
      padding: 9px 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
      font-size: 11px;
      font-weight: 900;
      animation: toastIn .15s ease-out;
    }

    .success-toast i { color: #35c66c; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pay-cash { background: #159f4c; }
    .pay-online { background: #2563df; }
    .pay-credit { background: #efb800; color: #151515; }

    .empty-checkout {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
    }

    .empty-checkout-text strong {
      display: block;
      font-size: 11px;
      color: #4e5862;
    }

    .empty-checkout-text span {
      display: block;
      margin-top: 2px;
      font-size: 9px;
      color: #9299a1;
      font-weight: 700;
    }

    .empty-checkout-total {
      color: #8c949d;
      font-size: 21px;
      font-weight: 950;
    }

    .bottom-nav {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: #fff;
    }

    .nav-button {
      min-height: 58px;
      border: 0;
      border-top: 3px solid transparent;
      background: #fff;
      color: #737b84;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
    }

    .nav-button i { font-size: 17px; }

    .nav-button span {
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .nav-button.active {
      color: #2563df;
      border-top-color: #2563df;
      background: #f0f6ff;
    }

    .screen-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #d9dee3;
      padding: 4px 2px 9px;
      margin-bottom: 10px;
    }

    .screen-heading h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 950;
    }

    .screen-heading p {
      margin: 2px 0 0;
      color: #818993;
      font-size: 10px;
      font-weight: 700;
    }

    .surface {
      background: #fff;
      border: 1px solid #d7dce2;
      border-radius: 9px;
      box-shadow: 0 1px 2px rgba(0,0,0,.035);
    }

    .form-input {
      width: 100%;
      min-height: 45px;
      border: 1px solid #cfd5db;
      border-radius: 7px;
      padding: 0 12px;
      background: #fff;
      color: #17202a;
      font-size: 15px;
      outline: none;
    }

    .form-input:focus {
      border-color: #6da5e8;
      box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }

    .primary-btn, .danger-btn, .neutral-btn {
      min-height: 43px;
      border-radius: 7px;
      padding: 0 14px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary-btn { background: #1769d1; color: #fff; }
    .danger-btn { background: #d92d20; color: #fff; }
    .neutral-btn { background: #eef0f2; border-color: #d4d9de; color: #3f4750; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(12,18,25,.70);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: #fff;
      border-radius: 11px;
      padding: 16px;
      box-shadow: 0 18px 60px rgba(0,0,0,.28);
    }

    .settings-section-title {
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #68717c;
      margin-bottom: 8px;
    }

    .history-filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 10px;
    }

    .history-filter {
      min-height: 38px;
      border: 1px solid #d4dae0;
      background: #fff;
      color: #626c76;
      border-radius: 7px;
      font-size: 9px;
      font-weight: 950;
      cursor: pointer;
    }

    .history-filter.active {
      background: #1769d1;
      border-color: #1769d1;
      color: #fff;
    }

    .machine-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .machine-tag {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      padding: 0 6px;
      border-radius: 5px;
      background: #eef5ff;
      border: 1px solid #cfe0f7;
      color: #1559a8;
      font-size: 8px;
      font-weight: 950;
    }

    .tow-transfer {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 7px;
    }

    .tow-transfer-label {
      color: #7c858f;
      font-size: 9px;
      font-weight: 800;
      margin-right: 2px;
    }

    .tow-transfer button {
      min-height: 27px;
      border: 1px solid #d2d8de;
      background: #f5f6f7;
      color: #5d6670;
      border-radius: 5px;
      padding: 0 7px;
      font-size: 8px;
      font-weight: 950;
    }

    .tow-transfer button.active {
      background: #1769d1;
      border-color: #1769d1;
      color: #fff;
    }

    .expense-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .expense-method {
      min-height: 40px;
      border: 1px solid #d2d8de;
      background: #f5f6f7;
      color: #5d6670;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 950;
    }

    .expense-method.active {
      background: #1769d1;
      border-color: #1769d1;
      color: #fff;
    }

    .settings-machine-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .settings-hint {
      margin-top: 7px;
      color: #858d96;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.4;
    }

    .receipt-container {
      width: 302px;
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      color: #000;
      box-sizing: border-box;
    }

    .receipt-logo {
      display: block;
      width: 150px;
      max-width: 90%;
      max-height: 58px;
      height: auto;
      object-fit: contain;
      margin: 0 auto 5px;
    }

    .receipt-business {
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .receipt-subtitle {
      text-align: center;
      font-size: 8px;
      margin-top: 2px;
      letter-spacing: .04em;
    }

    .receipt-divider {
      border-top: 1px dashed #000;
      margin: 8px 0;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    @media (min-width: 640px) {
      .app-shell { padding-left: 16px; padding-right: 16px; }
      .ride-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 380px) {
      .control-strip { grid-template-columns: 1fr; }
      .ride-button { min-height: 108px; padding-right: 92px; }
      .ride-qty-control { right: 6px; top: 6px; }
      .brand-title strong { font-size: 11px; }
      .active-machine-pill { padding: 6px 8px; }
      .secondary-action { padding: 0 7px; }
      .pay-button { font-size: 11px; }
    }
  </style>
</head>

<body>
  <main id="app" class="app-shell"></main>

  <footer id="pos-footer">
    <div id="checkout-dock"></div>

    <nav class="bottom-nav">
      <button onclick="setView('pos')" id="nav-pos" class="nav-button active">
        <i class="fa-solid fa-cash-register"></i>
        <span>POS</span>
      </button>
      <button onclick="setView('history')" id="nav-history" class="nav-button">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>History</span>
      </button>
      <button onclick="setView('expenses')" id="nav-expenses" class="nav-button">
        <i class="fa-solid fa-receipt"></i>
        <span>Expense</span>
      </button>
      <button onclick="setView('dashboard')" id="nav-dashboard" class="nav-button">
        <i class="fa-solid fa-chart-pie"></i>
        <span>EOD</span>
      </button>
      <button onclick="setView('settings')" id="nav-settings" class="nav-button">
        <i class="fa-solid fa-gear"></i>
        <span>Setup</span>
      </button>
    </nav>
  </footer>

  <div id="modals"></div>
  <div id="toast-root"></div>

  <script>
    const db = new Dexie('WaterSportsV6');

    db.version(1).stores({
      transactions: '++id, receiptId, timestamp, totalAmount, discountAmount, paymentMethod, reference, customerName, customerPhone, status',
      expenses: '++id, timestamp, description, amount',
      menu: '++id, name, price, isTowable'
    });

    // V2 adds persistent POS configuration without changing existing sales/menu data.
    db.version(2).stores({
      transactions: '++id, receiptId, timestamp, totalAmount, discountAmount, paymentMethod, reference, customerName, customerPhone, status',
      expenses: '++id, timestamp, description, amount',
      menu: '++id, name, price, isTowable',
      settings: 'key'
    });

    let state = {
      view: 'pos',
      cart: {},
      menu: [],
      history: [],
      expenses: [],
      activeJetski: 1,
      towingMachine: 'JETSKI1',
      historyMachineFilter: 'ALL',
      expensePaymentMethod: 'CASH',
      customerModalOpen: false,
      creditModalOpen: false,
      discountModalOpen: false,
      moreOpen: false,
      checkoutLocked: false,
      toastTimer: null,
      settings: {
        nextInvoiceNumber: 1001,
        jetskiNames: { 1: 'Jetski 1', 2: 'Jetski 2' }
      },
      settingsLoaded: false,
      highestInvoiceNumber: 0,
      previewTxId: null,
      isKOTPreview: false,
      editingRideId: null,
      customer: { name: '', phone: '' },
      discount: { type: 'none', value: 0 },
      stats: {
        cash: 0,
        online: 0,
        credit: 0,
        expenseTotal: 0,
        cashExpenseTotal: 0,
        onlineExpenseTotal: 0,
        netCash: 0,
        netOnline: 0,
        voidCount: 0,
        voidAmount: 0,
        list: []
      }
    };

    const $ = id => document.getElementById(id);

    function escapeHTML(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function money(value) {
      return '₹' + Number(value || 0).toLocaleString('en-IN');
    }

    function localDateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    async function loadAppSettings() {
      const defaults = {
        nextInvoiceNumber: 1001,
        jetskiNames: { 1: 'Jetski 1', 2: 'Jetski 2' }
      };

      try {
        const saved = await db.settings.get('pos');
        const next = Number(saved?.nextInvoiceNumber);
        state.settings = {
          nextInvoiceNumber: Number.isInteger(next) && next > 0 ? next : defaults.nextInvoiceNumber,
          jetskiNames: {
            1: String(saved?.jetskiNames?.[1] || defaults.jetskiNames[1]).trim() || defaults.jetskiNames[1],
            2: String(saved?.jetskiNames?.[2] || defaults.jetskiNames[2]).trim() || defaults.jetskiNames[2]
          }
        };
      } catch (error) {
        console.warn('Could not load POS settings', error);
        state.settings = defaults;
      }

      state.settingsLoaded = true;
    }

    async function saveAppSettings() {
      await db.settings.put({
        key: 'pos',
        nextInvoiceNumber: state.settings.nextInvoiceNumber,
        jetskiNames: {
          1: state.settings.jetskiNames[1],
          2: state.settings.jetskiNames[2]
        }
      });
    }

    function machineName(num) {
      return state.settings.jetskiNames[num] || `Jetski ${num}`;
    }

    async function loadInvoiceSequence() {
      const all = await db.transactions.toArray();
      state.highestInvoiceNumber = all.reduce((highest, tx) => {
        const match = String(tx.receiptId || '').match(/(?:INV-)?(\d+)$/i);
        return match ? Math.max(highest, Number(match[1])) : highest;
      }, 0);

      const safeNext = Math.max(1, Number(state.settings.nextInvoiceNumber || 1), state.highestInvoiceNumber + 1);
      if (safeNext !== state.settings.nextInvoiceNumber) {
        state.settings.nextInvoiceNumber = safeNext;
        await saveAppSettings();
      }
    }

    function getNextInvoiceNumber() {
      return Math.max(1, Number(state.settings.nextInvoiceNumber || 1), state.highestInvoiceNumber + 1);
    }

    async function boot() {
      await loadAppSettings();
      const count = await db.menu.count();

      if (count === 0) {
        await db.menu.bulkAdd([
          { name: 'Jetski', price: 400, isTowable: false },
          { name: 'Speedboat', price: 250, isTowable: false },
          { name: 'Bandwagon', price: 200, isTowable: true },
          { name: 'Sleeper', price: 200, isTowable: true },
          { name: 'Ringo', price: 200, isTowable: true },
          { name: 'Banana', price: 200, isTowable: true },
          { name: 'Double banana', price: 200, isTowable: true }
        ]);
      }

      await loadMenuData();
      await loadHistoryData();
      await loadInvoiceSequence();
      render();
    }

    async function loadMenuData() {
      state.menu = await db.menu.toArray();
    }

    async function loadHistoryData() {
      const today = localDateKey();
      const all = await db.transactions.toArray();

      state.history = all
        .filter(tx => localDateKey(new Date(tx.timestamp)) === today)
        .reverse();
    }

    async function loadExpenseData() {
      const today = localDateKey();
      const all = await db.expenses.toArray();

      state.expenses = all
        .filter(ex => localDateKey(new Date(ex.timestamp)) === today)
        .reverse();
    }

    async function loadDashboardData() {
      await loadHistoryData();
      await loadExpenseData();

      const s = {
        cash: 0,
        online: 0,
        credit: 0,
        expenseTotal: 0,
        cashExpenseTotal: 0,
        onlineExpenseTotal: 0,
        netCash: 0,
        netOnline: 0,
        voidCount: 0,
        voidAmount: 0,
        list: []
      };

      state.history.forEach(tx => {
        if (tx.status === 'VOID') {
          s.voidCount++;
          s.voidAmount += Number(tx.totalAmount || 0);
          return;
        }

        if (tx.paymentMethod === 'CASH') s.cash += Number(tx.totalAmount || 0);
        if (tx.paymentMethod === 'ONLINE') s.online += Number(tx.totalAmount || 0);

        if (tx.paymentMethod === 'CREDIT') {
          s.credit += Number(tx.totalAmount || 0);
          s.list.push(tx);
        }
      });

      state.expenses.forEach(ex => {
        const amount = Number(ex.amount || 0);
        const method = ex.paymentMethod || 'CASH';
        s.expenseTotal += amount;
        if (method === 'ONLINE') s.onlineExpenseTotal += amount;
        else s.cashExpenseTotal += amount;
      });

      s.netCash = s.cash - s.cashExpenseTotal;
      s.netOnline = s.online - s.onlineExpenseTotal;
      state.stats = s;
    }

    function getCartSubtotal() {
      return Object.values(state.cart)
        .reduce((sum, c) => sum + (Number(c.item.price) * Number(c.qty)), 0);
    }

    function getDiscountAmount() {
      const sub = getCartSubtotal();

      if (state.discount.type === 'fixed') {
        return Math.min(sub, Math.max(0, Number(state.discount.value || 0)));
      }

      if (state.discount.type === 'percent') {
        const percent = Math.min(100, Math.max(0, Number(state.discount.value || 0)));
        return Math.round(sub * (percent / 100));
      }

      return 0;
    }

    function getCartTotal() {
      return Math.max(0, getCartSubtotal() - getDiscountAmount());
    }

    function getCartQty() {
      return Object.values(state.cart)
        .reduce((sum, c) => sum + Number(c.qty || 0), 0);
    }

    window.handleTap = menuId => {
      if (state.checkoutLocked) return;

      const item = state.menu.find(m => m.id === menuId);
      if (!item) return;

      const towedBy = item.isTowable ? state.towingMachine : null;
      const cartKey = towedBy
        ? `${menuId}_${towedBy}`
        : `${menuId}_none`;

      if (state.cart[cartKey]) {
        state.cart[cartKey].qty += 1;
      } else {
        state.cart[cartKey] = { item, qty: 1, towedBy };
      }

      render();
    };

    window.updateQty = (cartKey, delta) => {
      if (state.checkoutLocked || !state.cart[cartKey]) return;

      state.cart[cartKey].qty += delta;

      if (state.cart[cartKey].qty <= 0) delete state.cart[cartKey];

      if (Object.keys(state.cart).length === 0) {
        state.discount = { type: 'none', value: 0 };
      }

      render();
    };

    window.setJetski = num => {
      if (state.checkoutLocked) return;
      state.activeJetski = num;
      render();
    };

    function normalizeMachineId(machine) {
      if (machine === 'JETSKI') return 'JETSKI1';
      return machine;
    }

    function getMachineLabel(machine) {
      machine = normalizeMachineId(machine);
      if (machine === 'JETSKI1') return machineName(1);
      if (machine === 'JETSKI2') return machineName(2);
      if (machine === 'SPEEDBOAT') return 'Speed Boat';
      return machine || 'Unknown';
    }

    function getTransactionMachines(tx) {
      if (Array.isArray(tx.machineUsage) && tx.machineUsage.length) return tx.machineUsage;

      const machines = [];
      if (tx.activeJetskiId) machines.push(`JETSKI${tx.activeJetskiId}`);
      try {
        Object.values(JSON.parse(tx.items || '{}')).forEach(c => {
          if (c.towedBy) machines.push(normalizeMachineId(c.towedBy));
        });
      } catch {}
      return [...new Set(machines)];
    }

    function transactionUsesMachine(tx, filter) {
      if (filter === 'ALL') return true;
      return getTransactionMachines(tx).includes(filter);
    }

    window.setTowingMachine = machine => {
      if (state.checkoutLocked) return;
      state.towingMachine = normalizeMachineId(machine);
      render();
    };

    window.transferTowable = (cartKey, targetMachine) => {
      if (state.checkoutLocked || !state.cart[cartKey]) return;
      const line = state.cart[cartKey];
      if (!line.item.isTowable) return;

      targetMachine = normalizeMachineId(targetMachine);
      if (!['JETSKI1','JETSKI2','SPEEDBOAT'].includes(targetMachine)) return;
      if (line.towedBy === targetMachine) return;

      const newKey = `${line.item.id}_${targetMachine}`;
      if (state.cart[newKey]) {
        state.cart[newKey].qty += line.qty;
      } else {
        state.cart[newKey] = { ...line, towedBy: targetMachine };
      }
      delete state.cart[cartKey];
      renderCartEditor();
    };

    window.toggleCustomerModal = isOpen => {
      state.customerModalOpen = isOpen;
      render();
    };

    window.toggleCreditModal = isOpen => {
      state.creditModalOpen = isOpen;
      render();
    };

    window.toggleDiscountModal = isOpen => {
      state.discountModalOpen = isOpen;
      render();
    };

    window.saveCustomerInfo = () => {
      const name = $('custName')?.value.trim() || '';
      const phone = $('custPhone')?.value.trim() || '';

      state.customer = { name, phone };
      state.customerModalOpen = false;
      render();
    };

    window.applyDiscount = type => {
      const val = parseFloat($('discountInput')?.value) || 0;

      if (val <= 0) {
        state.discount = { type: 'none', value: 0 };
      } else {
        state.discount = {
          type,
          value: type === 'percent' ? Math.min(100, val) : val
        };
      }

      state.discountModalOpen = false;
      render();
    };

    window.clearDiscount = () => {
      state.discount = { type: 'none', value: 0 };
      state.discountModalOpen = false;
      render();
    };

    window.toggleMore = () => {
      state.moreOpen = !state.moreOpen;
      render();
    };

    window.processCheckout = async method => {
      if (state.checkoutLocked) return;

      const total = getCartTotal();
      const subtotal = getCartSubtotal();
      if (subtotal <= 0) return;

      let refText = '';
      if (method === 'CREDIT') {
        refText = $('creditInput')?.value.trim() || '';
        if (!refText) {
          showInlineError('Enter hotel, room or customer reference.');
          return;
        }
      }

      state.checkoutLocked = true;
      render();

      const completedMachine = state.activeJetski;
      const completedMachineName = machineName(completedMachine);
      const discountAmount = getDiscountAmount();
      const normalizedCart = Object.fromEntries(Object.entries(state.cart).map(([key, line]) => [key, { ...line, towedBy: line.towedBy ? normalizeMachineId(line.towedBy) : null }]));
      const cartSnapshot = JSON.stringify(normalizedCart);
      const machineUsage = [...new Set([`JETSKI${completedMachine}`, ...Object.values(normalizedCart).map(c => c.towedBy).filter(Boolean)])];
      const timestamp = new Date().toISOString();

      try {
        let invoiceNumber = 0;
        let receiptId = '';

        // Allocate the invoice number and save the sale atomically.
        // This prevents duplicate invoice numbers even if two tabs are open.
        await db.transaction('rw', db.transactions, db.settings, async () => {
          const allTransactions = await db.transactions.toArray();
          const highestStored = allTransactions.reduce((highest, tx) => {
            const match = String(tx.receiptId || '').match(/(?:INV-)?(\d+)$/i);
            return match ? Math.max(highest, Number(match[1])) : highest;
          }, 0);

          const savedSettings = await db.settings.get('pos');
          const configuredNext = Number(savedSettings?.nextInvoiceNumber || state.settings.nextInvoiceNumber || 1001);

          invoiceNumber = Math.max(1, configuredNext, highestStored + 1);
          receiptId = 'INV-' + invoiceNumber;

          await db.transactions.add({
            receiptId,
            timestamp,
            totalAmount: total,
            discountAmount,
            paymentMethod: method,
            reference: refText,
            customerName: state.customer.name,
            customerPhone: state.customer.phone,
            items: cartSnapshot,
            activeJetskiId: completedMachine,
            activeJetskiName: completedMachineName,
            machineUsage,
            status: 'COMPLETED'
          });

          await db.settings.put({
            key: 'pos',
            nextInvoiceNumber: invoiceNumber + 1,
            jetskiNames: {
              1: state.settings.jetskiNames[1],
              2: state.settings.jetskiNames[2]
            }
          });
        });

        state.highestInvoiceNumber = Math.max(state.highestInvoiceNumber, invoiceNumber);
        state.settings.nextInvoiceNumber = invoiceNumber + 1;

        state.cart = {};
        state.customer = { name: '', phone: '' };
        state.discount = { type: 'none', value: 0 };
        state.creditModalOpen = false;
        state.moreOpen = false;
        state.activeJetski = state.activeJetski === 1 ? 2 : 1;

        await loadHistoryData();
        state.checkoutLocked = false;
        render();
        showPaymentSuccess(total, receiptId, completedMachineName, method);
      } catch (error) {
        console.error(error);
        state.checkoutLocked = false;
        render();
        showInlineError('Payment could not be saved. Please try again.');
      }
    };

    function showInlineError(message) {
      const root = $('toast-root');
      if (!root) return;
      root.innerHTML = `<div class="success-toast" style="background:#8b1e16;"><i class="fa-solid fa-circle-exclamation" style="color:#ffd2cd;"></i><span>${escapeHTML(message)}</span></div>`;
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => { if ($('toast-root')) $('toast-root').innerHTML = ''; }, 2200);
    }

    function showPaymentSuccess(total, receiptId, machineNameText, method) {
      const root = $('toast-root');
      if (!root) return;
      root.innerHTML = `
        <div class="success-toast">
          <i class="fa-solid fa-circle-check"></i>
          <span>${money(total)} ${escapeHTML(method)} • ${escapeHTML(machineNameText)}</span>
        </div>
      `;
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => { if ($('toast-root')) $('toast-root').innerHTML = ''; }, 1200);
    }

    window.voidTransaction = async id => {
      if (!confirm('Are you sure you want to VOID this ticket?')) return;

      await db.transactions.update(id, { status: 'VOID' });
      await loadHistoryData();
      render();
    };

    window.setExpensePaymentMethod = method => {
      state.expensePaymentMethod = method === 'ONLINE' ? 'ONLINE' : 'CASH';
      render();
    };

    window.addExpense = async () => {
      const desc = $('expDesc')?.value.trim() || '';
      const amt = parseFloat($('expAmt')?.value);

      if (!desc || !amt || amt <= 0) return;

      await db.expenses.add({
        timestamp: new Date().toISOString(),
        description: desc,
        amount: amt,
        paymentMethod: state.expensePaymentMethod || 'CASH'
      });

      await loadExpenseData();
      render();
    };

    window.savePOSSettings = async () => {
      const invoiceInput = $('nextInvoiceNumber');
      const js1Input = $('jetskiName1');
      const js2Input = $('jetskiName2');

      const invoiceNumber = parseInt(invoiceInput?.value || '', 10);
      const name1 = js1Input?.value.trim() || '';
      const name2 = js2Input?.value.trim() || '';

      if (!Number.isInteger(invoiceNumber) || invoiceNumber < 1) {
        showInlineError('Enter a valid invoice number.');
        return;
      }

      if (!name1 || !name2) {
        showInlineError('Both Jetski names are required.');
        return;
      }

      const highestExisting = state.highestInvoiceNumber;
      const safeNext = Math.max(invoiceNumber, highestExisting + 1);
      state.settings.nextInvoiceNumber = safeNext;
      state.settings.jetskiNames = { 1: name1, 2: name2 };

      try {
        await saveAppSettings();
        render();
        showInlineError(invoiceNumber <= highestExisting ? `Invoice adjusted to INV-${safeNext} to avoid duplicates.` : 'Settings saved.');
      } catch (error) {
        console.error(error);
        showInlineError('Settings could not be saved.');
      }
    };

    window.addOrUpdateMenuItem = async () => {
      const name = $('menuName')?.value.trim() || '';
      const price = parseFloat($('menuPrice')?.value);
      const isTowable = $('menuTowable')?.checked || false;

      if (!name || !price || price <= 0) return;

      if (state.editingRideId) {
        await db.menu.update(state.editingRideId, {
          name,
          price,
          isTowable
        });
        state.editingRideId = null;
      } else {
        await db.menu.add({ name, price, isTowable });
      }

      await loadMenuData();
      render();
    };

    window.editMenuItem = id => {
      state.editingRideId = id;
      render();
    };

    window.cancelEditMenu = () => {
      state.editingRideId = null;
      render();
    };

    window.deleteMenuItem = async id => {
      if (!confirm('Are you sure you want to delete this item?')) return;

      await db.menu.delete(id);
      await loadMenuData();
      render();
    };

    window.openPreview = (txId, isKOT = false) => {
      state.previewTxId = txId;
      state.isKOTPreview = isKOT;
      render();
    };

    window.closePreview = () => {
      state.previewTxId = null;
      render();
    };

    function generateReceiptHTML(tx, isKOT = false) {

      const itemsHtml = Object.values(items).map(c => `
        <div style="display:flex;justify-content:space-between;gap:7px;margin-bottom:5px;font-size:11px;line-height:1.25;border-bottom:1px dashed #ccc;padding-bottom:4px;">
          <div style="flex:1;padding-right:4px;">

          <div style="border-top:1px dashed #000;margin-top:10px;padding-top:7px;text-align:center;font-size:9px;">

    window.triggerDownload = async isKOT => {
      const element = $('printable-receipt');
      if (!element) return;

      const tx = state.history.find(t => t.id === state.previewTxId);
      const prefix = isKOT ? 'KOT' : 'Bill';
      const logo = element.querySelector('.receipt-logo');

      try {
        if (logo && !logo.complete) {
          await new Promise(resolve => {
            logo.addEventListener('load', resolve, { once: true });
            logo.addEventListener('error', resolve, { once: true });
          });
        }

        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        await html2pdf().set({
          margin: [2, 0, 2, 0],
          filename: `${prefix}_${tx ? tx.receiptId : 'Receipt'}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 3,
            useCORS: true,
            allowTaint: false,
            logging: false
          },
          jsPDF: {
            unit: 'mm',
            format: [80, 180],
            orientation: 'portrait'
          }
        }).from(element).save();
      } catch (error) {
        console.error(error);
        showInlineError('Could not generate the bill PDF.');
      }
    };

    window.printViaBluetooth = () => {
      alert('Bluetooth printer integration can be connected here in the next version.');

    window.setView = async viewName => {

      ['pos', 'history', 'expenses', 'dashboard', 'settings'].forEach(v => {
        const el = $('nav-' + v);
        if (!el) return;
        el.classList.toggle('active', state.view === v);
      });

      if (viewName === 'history') await loadHistoryData();
      if (viewName === 'expenses') await loadExpenseData();
      if (viewName === 'dashboard') await loadDashboardData();

      render();

              <span>Water Sports POS</span>
            </div>
          </div>

          <div class="active-machine-pill">
            <span class="status-dot"></span>
            ${escapeHTML(machineName(state.activeJetski))}
          </div>
        </header>
      `;

    function renderPOS() {
      const cartQty = getCartQty();

      return `
        ${renderHeader()}

        <section class="control-strip">
          <div class="control-group">
            <span class="control-label">Machine</span>
            <div class="segmented">
              <button onclick="setJetski(1)" class="${state.activeJetski === 1 ? 'active-machine' : ''}">${escapeHTML(machineName(1))}</button>

    function renderCheckoutDock() {
      if (state.view !== 'pos') return '';

      const cartItems = Object.entries(state.cart);
      const subtotal = getCartSubtotal();
      const discountAmt = getDiscountAmount();
      const total = getCartTotal();
      const cartQty = getCartQty();

      if (cartItems.length === 0) {
        return `
          <div class="empty-checkout">
            <div class="empty-checkout-text">
              <strong>Ready for next customer</strong>
              <span>Choose a ride to start billing</span>
            </div>
            <div class="empty-checkout-total">₹0</div>
          </div>
        `;
      }

      const orderText = cartItems.map(([key, data]) => {
        const tow = data.towedBy ? ` • ${getMachineLabel(data.towedBy)}` : '';
        return `${data.qty}× ${data.item.name}${tow}`;
      }).join('  |  ');

      return `
        <div class="checkout-panel">
          <div class="checkout-top">
            <div class="order-preview">
              <span class="order-count">${cartQty} ${cartQty === 1 ? 'RIDE' : 'RIDES'}</span>
              <span class="order-items-text">${escapeHTML(orderText)}</span>

            <div class="total-box">
              <span class="total-label">${discountAmt ? `Saved ${money(discountAmt)}` : 'Total'}</span>
              ${discountAmt ? `<span style="display:block;color:#9ca3af;font-size:9px;text-decoration:line-through;">${money(subtotal)}</span>` : ''}
              <span class="total-value">${money(total)}</span>

          <div class="more-row">

            <button onclick="toggleCustomerModal(true)" class="secondary-action ${state.customer.name || state.customer.phone ? 'has-value' : ''}">
              <i class="fa-solid fa-user"></i>
              ${state.customer.name ? escapeHTML(state.customer.name.substring(0, 12)) : 'Customer'}
            </button>

            <button onclick="toggleDiscountModal(true)" class="secondary-action ${discountAmt > 0 ? 'has-value' : ''}">

              <i class="fa-solid fa-qrcode"></i> ONLINE

                const machines = getTransactionMachines(tx);

                        <div class="machine-tags">

              }).join('')}

      `;

          Live Menu
        </div>

        <div class="surface" style="overflow:hidden;margin-bottom:16px;">
          ${state.menu.map(item => `
            <div style="padding:11px;border-bottom:1px solid #e4e7ea;display:flex;justify-content:space-between;align-items:center;gap:10px;">
              <div style="min-width:0;">
                <div style="font-size:12px;font-weight:950;">${escapeHTML(item.name)}</div>
                <div style="font-size:10px;font-weight:900;color:#1769d1;margin-top:2px;">
                  ${money(item.price)}
                  ${item.isTowable ? `<span style="margin-left:5px;color:#6c7480;background:#f0f1f3;border:1px solid #dfe2e5;border-radius:4px;padding:2px 4px;font-size:8px;">TOWED</span>` : ''}
                </div>
              </div>

              <div style="display:flex;gap:5px;flex-shrink:0;">
                <button onclick="editMenuItem(${item.id})" class="neutral-btn" style="width:36px;min-height:34px;padding:0;">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="deleteMenuItem(${item.id})" class="neutral-btn" style="width:36px;min-height:34px;padding:0;color:#c5261b;background:#fff3f2;border-color:#f0d0cd;">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderPreviewModal() {
      if (!state.previewTxId) return '';

      const tx = state.history.find(t => t.id === state.previewTxId);
      if (!tx) return '';

      return `
        <div class="modal-backdrop" style="overflow-y:auto;align-items:flex-start;padding-top:18px;">
          <div style="width:100%;max-width:390px;">
            <div style="display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:8px;">
              <strong style="font-size:14px;">
                ${state.isKOTPreview ? 'KOT Preview' : 'Bill Preview'}
              </strong>
              <button onclick="closePreview()" style="width:34px;height:34px;border:0;border-radius:50%;background:#242b33;color:#fff;font-size:20px;">
                ×
              </button>
            </div>

            <div style="background:#e7e9ec;border-radius:8px;padding:8px;box-shadow:0 15px 45px rgba(0,0,0,.35);overflow:auto;max-height:62vh;">
              ${generateReceiptHTML(tx, state.isKOTPreview)}
            </div>

            <div style="display:grid;gap:7px;margin-top:9px;">
              <button onclick="triggerDownload(${state.isKOTPreview})" class="primary-btn" style="width:100%;">
                <i class="fa-solid fa-download"></i> Download PDF
              </button>

              <button onclick="printViaBluetooth()" class="neutral-btn" style="width:100%;background:#fff;color:#444;">
                <i class="fa-solid fa-bluetooth"></i> Print via Bluetooth
              </button>

              <button onclick="closePreview()" class="neutral-btn" style="width:100%;">
                Close
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderModalState() {
      let html = '';

      if (state.customerModalOpen) {
        html += `
          <div class="modal-backdrop">
            <div class="modal-card">
              <div style="font-size:17px;font-weight:950;margin-bottom:3px;">Customer Details</div>
              <div style="font-size:10px;color:#858d96;font-weight:700;margin-bottom:13px;">Optional — useful for credit or repeat customers.</div>

              <input id="custName" type="text" placeholder="Customer name" value="${escapeHTML(state.customer.name)}" class="form-input" style="margin-bottom:7px;">
              <input id="custPhone" type="tel" inputmode="tel" placeholder="Phone number" value="${escapeHTML(state.customer.phone)}" class="form-input" style="margin-bottom:12px;">

              <div style="display:flex;gap:7px;">
                <button onclick="toggleCustomerModal(false)" class="neutral-btn" style="flex:1;">Cancel</button>
                <button onclick="saveCustomerInfo()" class="primary-btn" style="flex:1;">Save</button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.creditModalOpen) {
        html += `
          <div class="modal-backdrop">
            <div class="modal-card">
              <div style="font-size:17px;font-weight:950;margin-bottom:3px;">Credit Reference</div>
              <div style="font-size:10px;color:#858d96;font-weight:700;margin-bottom:13px;">Enter hotel, room number or customer reference.</div>

              <input id="creditInput" type="text" placeholder="Hotel / Room / Name" class="form-input" style="margin-bottom:12px;">

              <div style="display:flex;gap:7px;">
                <button onclick="toggleCreditModal(false)" class="neutral-btn" style="flex:1;">Cancel</button>
                <button onclick="processCheckout('CREDIT')" class="pay-button pay-credit" style="flex:1;min-height:43px;">Complete</button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.discountModalOpen) {
        html += `
          <div class="modal-backdrop">
            <div class="modal-card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
                <div style="font-size:17px;font-weight:950;">Discount</div>
                <button onclick="clearDiscount()" style="border:0;background:#fff1f0;color:#c5261b;border-radius:5px;padding:5px 7px;font-size:9px;font-weight:900;">Clear</button>
              </div>

              <div style="font-size:10px;color:#858d96;font-weight:700;margin-bottom:13px;">
                Enter a flat rupee amount or percentage.
              </div>

              <input id="discountInput" type="number" inputmode="decimal" placeholder="Enter amount / %" class="form-input" style="margin-bottom:9px;">

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">
                <button onclick="applyDiscount('fixed')" class="primary-btn">₹ Flat</button>
                <button onclick="applyDiscount('percent')" class="primary-btn">% Off</button>
              </div>
            </div>
          </div>
        `;
      }

      html += renderPreviewModal();
      return html;
    }

    function updateFooterHeight() {
      requestAnimationFrame(() => {
        const footer = $('pos-footer');
        if (!footer) return;

        document.documentElement.style.setProperty(
          '--footer-height',
          `${footer.offsetHeight}px`
        );
      });
    }

    function render() {
      const app = $('app');
      const checkoutDock = $('checkout-dock');
      const modals = $('modals');

      let appHtml = '';

      if (state.view === 'pos') appHtml = renderPOS();
      if (state.view === 'history') appHtml = renderHistory();
      if (state.view === 'expenses') appHtml = renderExpenses();
      if (state.view === 'dashboard') appHtml = renderDashboard();
      if (state.view === 'settings') appHtml = renderSettings();

      app.innerHTML = appHtml;
      checkoutDock.innerHTML = renderCheckoutDock();
      modals.innerHTML = renderModalState();

      updateFooterHeight();
    }

    window.addEventListener('resize', updateFooterHeight);
    window.addEventListener('orientationchange', () => setTimeout(updateFooterHeight, 100));

    boot();
  </script>
</body>
</html>
